document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"0ec192ba-fe5c-44f6-a83e-09b3a442df55\"><\u002Fscript>\n  <script src=\"713b2ad3-c489-472b-954e-aca8febbd95b\"><\u002Fscript>\n  <style>\n    :root {\n      --color-accent: #4338ca;\n      --color-accent-100: #eef0fc;\n      --color-accent-200: #dde1f9;\n      --color-accent-300: #c7d2fe;\n      --color-accent-400: #a5b4fc;\n      --color-accent-500: #6366f1;\n      --color-accent-600: #3730a3;\n      --color-accent-700: #312e81;\n      --color-accent-800: #27225f;\n      --color-accent-900: #1e1b4b;\n    }\n    body { margin: 0; text-wrap: pretty; }\n    a { color: var(--color-accent); text-decoration: none; }\n    a:hover { color: var(--color-accent-700); text-decoration: underline; }\n    .oso-navlink { color: inherit; text-decoration: none; font-family: var(--font-heading); font-weight: 600; font-size: 14px; padding: 6px 2px; border-bottom: 2px solid transparent; transition: color .2s, border-color .2s; }\n    .oso-navlink:hover { color: var(--color-accent); text-decoration: none; }\n    .oso-navlink[aria-current='page'] { color: var(--color-accent); border-bottom-color: var(--color-accent); }\n    .oso-sidelink { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 14px; color: var(--color-text); text-decoration: none; border-left: 3px solid transparent; }\n    .oso-sidelink:hover { background: var(--color-neutral-100); text-decoration: none; }\n    .oso-sidelink[aria-current='page'] { background: var(--color-neutral-100); font-weight: 700; border-left-color: var(--color-accent); }\n    @keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }\n    @keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n    @keyframes popIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }\n    @keyframes oso-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }\n    .oso-page { animation: fadeUp .7s cubic-bezier(.16,1,.3,1) both; }\n    @media (max-width: 860px) {\n      .oso-2col { grid-template-columns: 1fr !important; }\n      nav { gap: 14px !important; }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:var(--color-bg);color:var(--color-text);min-height:100vh;font-family:var(--font-body)\">\n\n<!-- ============================================================ -->\n<!-- PART 1 — PUBLIC WEBSITE                                       -->\n<!-- ============================================================ -->\n<sc-if value=\"{{ isPublic }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n  <nav style=\"display:flex;align-items:center;gap:26px;padding:14px clamp(20px,5vw,64px);border-bottom:2px solid var(--color-divider);flex-wrap:wrap;background:var(--color-bg);position:sticky;top:0;z-index:50\">\n    <div style=\"display:flex;align-items:center;gap:12px;margin-right:auto;cursor:pointer\" sc-camel-on-click=\"{{ goHome }}\">\n      <img src=\"64cbb102-90d4-4bc7-9c62-c0947d75f749\" alt=\"Omni Skills Olympiad\" style=\"height:38px;width:38px;object-fit:contain\">\n      <div style=\"display:flex;flex-direction:column;line-height:1.15\">\n        <span style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;letter-spacing:-0.01em\">OMNI SKILLS OLYMPIAD<\u002Fspan>\n        <span style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 55%, transparent)\">infinite opportunities<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <a class=\"oso-navlink\" aria-current=\"{{ current.home }}\" sc-camel-on-click=\"{{ goHome }}\">Home<\u002Fa>\n    <a class=\"oso-navlink\" aria-current=\"{{ current.about }}\" sc-camel-on-click=\"{{ goAbout }}\">About<\u002Fa>\n    <a class=\"oso-navlink\" aria-current=\"{{ current.events }}\" sc-camel-on-click=\"{{ goEvents }}\">Events<\u002Fa>\n    <a class=\"oso-navlink\" aria-current=\"{{ current.talks }}\" sc-camel-on-click=\"{{ goTalks }}\">Blog<\u002Fa>\n    <a class=\"oso-navlink\" aria-current=\"{{ current.leaderboard }}\" sc-camel-on-click=\"{{ goLeaderboard }}\">Leaderboard<\u002Fa>\n    <a class=\"oso-navlink\" aria-current=\"{{ current.contact }}\" sc-camel-on-click=\"{{ goContact }}\">Contact<\u002Fa>\n    <div style=\"display:flex;gap:10px;align-items:center\">\n      <div style=\"display:flex;gap:2px;border:2px solid var(--color-divider);padding:2px\">\n        <button type=\"button\" class=\"btn btn-ghost\" style=\"padding:8px 12px;font-size:12px\" sc-camel-on-click=\"{{ goPortalStudent }}\">Student<\u002Fbutton>\n        <button type=\"button\" class=\"btn btn-ghost\" style=\"padding:8px 12px;font-size:12px\" sc-camel-on-click=\"{{ goPortalMentor }}\">Mentor<\u002Fbutton>\n        <button type=\"button\" class=\"btn btn-ghost\" style=\"padding:8px 12px;font-size:12px\" sc-camel-on-click=\"{{ goPortalInstitutionAdmin }}\">Institution<\u002Fbutton>\n      <\u002Fdiv>\n      <button type=\"button\" class=\"btn btn-secondary\" style=\"transition:transform .15s\" style-hover=\"transform:translateY(-2px)\" sc-camel-on-click=\"{{ goPortalStudent }}\">Login<\u002Fbutton>\n      <button type=\"button\" class=\"btn btn-primary\" style=\"transition:transform .15s\" style-hover=\"transform:translateY(-2px)\" sc-camel-on-click=\"{{ goRegisterStudent }}\">Register<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- ============ HOME ============ -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <main class=\"oso-page\">\n      <section class=\"oso-2col\" style=\"max-width:1320px;margin:0 auto;padding:clamp(48px,8vw,88px) clamp(20px,5vw,64px) 0;display:grid;grid-template-columns:minmax(0,6.5fr) minmax(280px,5.5fr);gap:40px;align-items:end;position:relative\">\n        <div>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:18px\">\n            <span style=\"display:inline-block;width:34px;height:3px;background:var(--color-accent);animation:growX .6s ease .3s both;transform-origin:left\"><\u002Fspan>\n            <span style=\"font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700)\">National Technical Competition Platform · India<\u002Fspan>\n          <\u002Fdiv>\n          <h1 style=\"font-size:clamp(44px,8vw,104px);line-height:0.98;margin:0 0 24px;letter-spacing:-0.03em\">Compete on<br>skill. Not<br><span style=\"color:var(--color-accent)\">luck.<\u002Fspan><\u002Fh1>\n          <p style=\"font-size:18px;line-height:1.6;max-width:52ch;color:color-mix(in srgb, var(--color-text) 80%, transparent);margin:0 0 20px\">Engineering, polytechnic, ITI and university students compete across technical domains, train under dedicated industry mentors, and build a public track record through offline, physical competitions with a nominal entrance fee per event.<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:28px\">\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n            <span style=\"font-family:var(--font-heading);font-weight:700;font-size:14.5px\">Built with one goal: make every student industry-ready.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n            <button type=\"button\" class=\"btn btn-primary\" style=\"padding:14px 22px;font-si :absolute;bottom:0;right:0;width:22px;height:22px;border-radius:50%;background:var(--color-bg);transform:translate(50%,50%)\"><\u002Fspan>\n            <p style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(26px,2.6vw,38px);color:var(--color-accent-400);margin:0\">12+<\u002Fp>\n            <p style=\"font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;opacity:0.75;margin:6px 0 0\">Technical domains<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:150px;position:relative;padding:30px 22px;border-right:1px solid color-mix(in srgb, var(--color-bg) 18%, transparent)\">\n            <span style=\"position:absolute;top:0;right:0;width:22px;height:22px;border-radius:50%;background:var(--color-bg);transform:translate(50%,-50%)\"><\u002Fspan>\n            <span style=\"position:absolute;bottom:0;right:0;width:22px;height:22px;border-radius:50%;background:var(--color-bg);transform:translate(50%,50%)\"><\u002Fspan>\n            <p style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(26px,2.6vw,38px);color:var(--color-accent-400);margin:0\">1:1<\u002Fp>\n            <p style=\"font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;opacity:0.75;margin:6px 0 0\">Mentor to student<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:150px;position:relative;padding:30px 22px;border-right:1px solid color-mix(in srgb, var(--color-bg) 18%, transparent)\">\n            <span style=\"position:absolute;top:0;right:0;width:22px;height:22px;border-radius:50%;background:var(--color-bg);transform:translate(50%,-50%)\"><\u002Fspan>\n            <span style=\"position:absolute;bottom:0;right:0;width:22px;height:22px;border-radius:50%;background:var(--color-bg);transform:translate(50%,50%)\"><\u002Fspan>\n            <p style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(26px,2.6vw,38px);color:var(--color-accent-400);margin:0\">100%<\u002Fp>\n            <p style=\"font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;opacity:0.75;margin:6px 0 0\">Offline, physical events<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:150px;position:relative;padding:30px 22px;border-right:1px solid color-mix(in srgb, var(--color-bg) 18%, transparent)\">\n            <span style=\"position:absolute;top:0;right:0;width:22px;height:22px;border-radius:50%;background:var(--color-bg);transform:translate(50%,-50%)\"><\u002Fspan>\n            <span style=\"position:absolute;bottom:0;right:0;width:22px;height:22px;border-radius:50%;background:var(--color-bg);transform:translate(50%,50%)\"><\u002Fspan>\n            <p style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(26px,2.6vw,38px);color:var(--color-accent-400);margin:0\">7<\u002Fp>\n            <p style=\"font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;opacity:0.75;margin:6px 0 0\">VIBGYOR skill levels<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:150px;position:relative;padding:30px 22px\">\n            <p style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(26px,2.6vw,38px);color:var(--color-accent-400);margin:0\">100%<\u002Fp>\n            <p style=\"font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;opacity:0.75;margin:6px 0 0\">Industry-judged panels<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:1320px;margin:0 auto;padding:clamp(40px,6vw,64px) clamp(20px,5vw,64px) 0\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px\">\n          <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700)\">Upcoming events<\u002Fspan>\n          <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ goEvents }}\" style=\"font-size:13px;font-weight:700\">View full calendar →<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;overflow-x:auto;padding-bottom:4px\">\n          <sc-for list=\"{{ eventsNext }}\" as=\"e\" hint-placeholder-count=\"3\">\n            <div style=\"min-width:220px;flex:1;background:var(--color-surface);padding:20px;border-left:4px solid var(--color-accent);transition:transform .2s\" style-hover=\"transform:translateY(-4px)\">\n              <p style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;margin:0 0 6px\">{{ e.competition }}<\u002Fp>\n              <p style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin:0 0 10px\">{{ e.round }} · {{ e.city }}<\u002Fp>\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                <span style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--color-accent-700)\">{{ e.date }}<\u002Fspan>\n                <span class=\"tag tag-outline\">{{ e.status }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:1320px;margin:0 auto;padding:clamp(56px,8vw,96px) clamp(20px,5vw,64px)\">\n        <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 8px\">What the platform does<\u002Fspan>\n        <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:24px;margin-top:24px\">\n          <div style=\"grid-column:span 4;padding:36px;background:var(--color-text);color:var(--color-bg);transition:transform .3s\" style-hover=\"transform:translateY(-6px)\">\n            <p style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;color:var(--color-accent-400);margin:0 0 16px\">01<\u002Fp>\n            <h3 style=\"font-size:clamp(24px,2.6vw,32px);margin:0 0 12px;max-width:20ch\">Compete across every technical domain<\u002Fh3>\n            <p style=\"font-size:15px;line-height:1.6;opacity:0.8;max-width:52ch;margin:0\">Every listed competition runs offline, in person, judged by industry panels — across programming, hardware, AI, and other technical domains.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"grid-column:span 2;padding:32px;background:var(--color-surface);transition:transform .3s\" style-hover=\"transform:translateY(-6px)\">\n            <p style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--color-accent);margin:0 0 14px\">02<\u002Fp>\n            <h3 style=\"font-size:19px;margin:0 0 10px\">One mentor, one student<\u002Fh3>\n            <p style=\"font-size:13.5px;line-height:1.55;color:color-mix(in srgb, var(--color-text) 78%, transparent);margin:0\">Send a request; the mentor accepts or declines. No auto-matching.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"grid-column:span 6;padding:36px;background:var(--color-accent);color:var(--color-bg);transition:transform .3s\" style-hover=\"transform:translateY(-6px)\">\n            <p style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;margin:0 0 16px\">03<\u002Fp>\n            <h3 style=\"font-size:clamp(24px,2.6vw,32px);margin:0 0 12px;max-width:22ch\">Daily quiz, streaks, and a public leaderboard<\u002Fh3>\n            <p style=\"font-size:15px;line-height:1.6;opacity:0.9;max-width:52ch;margin:0\">One quiz a day, scored and streaked. Every result rolls up into a public leaderboard rank.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:1320px;margin:0 auto;padding:0 clamp(20px,5vw,64px) clamp(56px,8vw,96px)\">\n        <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 24px\">Who competes<\u002Fspan>\n        <div style=\"display:flex;gap:20px;flex-wrap:wrap\">\n          <sc-for list=\"{{ trackCards }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div style=\"flex:1;min-width:220px;padding:28px;border-top:4px solid {{ t.color }};background:var(--color-surface);transition:transform .3s;transform:translateY({{ t.offset }})\" style-hover=\"transform:translateY(-8px)\">\n              <h3 style=\"font-size:22px;margin:0 0 8px\">{{ t.name }}<\u002Fh3>\n              <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0\">{{ t.sub }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:1320px;margin:0 auto;padding:0 clamp(20px,5vw,64px) clamp(56px,8vw,96px)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px;gap:16px;flex-wrap:wrap\">\n          <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700)\">Featured industry mentors<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap\">\n          <sc-for list=\"{{ mentorsHome }}\" as=\"m\" hint-placeholder-count=\"3\">\n            <div style=\"flex:1;min-width:200px;transition:transform .3s\" style-hover=\"transform:translateY(-8px)\">\n              <div class=\"grayscale\" style=\"aspect-ratio:{{ m.aspect }};margin-bottom:14px;transition:filter .3s\" style-hover=\"filter:grayscale(0.4) contrast(1.08)\">\n                <image-slot id=\"home-mentor-{{ $index }}\" shape=\"rect\" placeholder=\"Mentor photo\"><\u002Fimage-slot>\n              <\u002Fdiv>\n              <p style=\"font-family:var(--font-heading);font-weight:800;font-size:16px;margin:0\">{{ m.name }}<\u002Fp>\n              <p style=\"font-size:13px;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin:2px 0 0\">{{ m.title }}, {{ m.company }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"max-width:1320px;margin:0 auto;padding:0 clamp(20px,5vw,64px) clamp(56px,8vw,96px)\">\n        <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 24px\">Our partners<\u002Fspan>\n        <div style=\"overflow:hidden;-webkit-mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent)\">\n          <div style=\"display:flex;gap:56px;width:max-content;animation:oso-marquee 26s linear infinite\">\n            <sc-for list=\"{{ partnerLogosLoop }}\" as=\"pl\" hint-placeholder-count=\"12\">\n              <div class=\"grayscale\" style=\"width:140px;aspect-ratio:16/9;flex-shrink:0;opacity:0.85\"><image-slot id=\"partner-logo-{{ $index }}\" shape=\"rect\" placeholder=\"Partner logo\"><\u002Fimage-slot><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background:var(--color-accent);color:var(--color-bg);padding:clamp(56px,9vw,100px) clamp(20px,5vw,64px);overflow:hidden;position:relative\">\n        <div style=\"max-width:1320px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;position:relative;z-index:1\">\n          <h2 style=\"font-size:clamp(32px,5vw,58px);margin:0;max-width:20ch;letter-spacing:-0.02em\">Ready to compete, mentor, or host a round?<\u002Fh2>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n            <button type=\"button\" class=\"btn btn-secondary\" style=\"color:var(--color-bg);border-color:var(--color-bg);padding:14px 22px;transition:transform .2s\" style-hover=\"transform:translateY(-3px)\" sc-camel-on-click=\"{{ goRegisterStudent }}\">Register as Student<\u002Fbutton>\n            <button type=\"button\" class=\"btn btn-secondary\" style=\"color:var(--color-bg);border-color:var(--color-bg);padding:14px 22px;transition:transform .2s\" style-hover=\"transform:translateY(-3px)\" sc-camel-on-click=\"{{ goRegisterMentor }}\">Register as Mentor<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"max-width:1320px;margin:20px auto 0;font-size:13px;opacity:0.85\">Represent a college? <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ goRegisterInstitution }}\" style=\"color:var(--color-bg);text-decoration:underline\">Register your institution →<\u002Fa><\u002Fp>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ ABOUT ============ -->\n  <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n    <main class=\"oso-page\" style=\"max-width:1320px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(20px,5vw,64px)\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.4fr) minmax(240px,1fr);gap:40px;align-items:end;margin-bottom:56px\">\n        <div>\n          <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 16px\">About Omni Skills Olympiad<\u002Fspan>\n          <h1 style=\"font-size:clamp(38px,5.6vw,64px);line-height:1.02;margin:0 0 20px;letter-spacing:-0.025em\">More IEEE than education portal.<\u002Fh1>\n          <p style=\"font-size:17px;line-height:1.65;max-width:60ch;color:color-mix(in srgb, var(--color-text) 82%, transparent);margin:0\">OSO is a national-level technical competition platform for engineering, polytechnic, ITI and university students. It exists to give technical skill a physical, judged, public arena — outside the classroom and outside the resume line.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"grayscale\" style=\"aspect-ratio:4/5;transition:transform .4s\" style-hover=\"transform:translateY(-6px)\">\n          <image-slot id=\"about-photo\" shape=\"rect\" placeholder=\"Students at a competition floor\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:2px;background:var(--color-divider);margin-bottom:64px;flex-wrap:wrap\">\n        <div style=\"flex:1;min-width:240px;background:var(--color-bg);padding:32px;transform:translateY(-8px)\"><h3 style=\"font-size:22px;margin:0 0 10px\">Mission<\u002Fh3><p style=\"font-size:14px;line-height:1.6;color:color-mix(in srgb, var(--color-text) 78%, transparent);margin:0\">Give every technical student, regardless of institution or region, an equal, fee-free arena to prove skill against real industry benchmarks.<\u002Fp><\u002Fdiv>\n        <div style=\"flex:1;min-width:240px;background:var(--color-text);color:var(--color-bg);padding:32px\"><h3 style=\"font-size:22px;margin:0 0 10px\">Vision<\u002Fh3><p style=\"font-size:14px;line-height:1.6;opacity:0.8;margin:0\">A national circuit of technical competitions credible enough that industry hires directly from its leaderboard.<\u002Fp><\u002Fdiv>\n        <div style=\"flex:1;min-width:240px;background:var(--color-bg);padding:32px;transform:translateY(-8px)\"><h3 style=\"font-size:22px;margin:0 0 10px\">Objectives<\u002Fh3><p style=\"font-size:14px;line-height:1.6;color:color-mix(in srgb, var(--color-text) 78%, transparent);margin:0\">Connect students with verified industry mentors, run credible offline competitions, and track measurable skill progression.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n\n      <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 24px\">Platform principles<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2px;background:var(--color-divider);margin-bottom:64px\">\n        <div style=\"background:var(--color-bg);padding:24px;transition:background .3s\" style-hover=\"background:var(--color-surface)\"><p style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;margin:0 0 6px\">Technology-first, not generic<\u002Fp><p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 78%, transparent);margin:0\">Built for competitive rigor across all technical streams, not as a course-delivery portal.<\u002Fp><\u002Fdiv>\n        <div style=\"background:var(--color-bg);padding:24px;transition:background .3s\" style-hover=\"background:var(--color-surface)\"><p style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;margin:0 0 6px\">All events offline / physical<\u002Fp><p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 78%, transparent);margin:0\">Every round is judged in person, reinforcing competitive credibility.<\u002Fp><\u002Fdiv>\n        <div style=\"background:var(--color-bg);padding:24px;transition:background .3s\" style-hover=\"background:var(--color-surface)\"><p style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;margin:0 0 6px\">Affordable entrance fee<\u002Fp><p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 78%, transparent);margin:0\">A nominal per-competition fee keeps events accessible while covering venue and judging costs.<\u002Fp><\u002Fdiv>\n        <div style=\"background:var(--color-bg);padding:24px;transition:background .3s\" style-hover=\"background:var(--color-surface)\"><p style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;margin:0 0 6px\">Anyone in education is a student<\u002Fp><p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 78%, transparent);margin:0\">Everyone else registers as a mentor, verified by admin before activation.<\u002Fp><\u002Fdiv>\n        <div style=\"background:var(--color-bg);padding:24px;transition:background .3s;grid-column:span 2\" style-hover=\"background:var(--color-surface)\"><p style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;margin:0 0 6px\">Built to make students industry-ready<\u002Fp><p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 78%, transparent);margin:0\">The main goal of every competition is industry readiness — measured against real benchmarks, not just academic performance.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n\n      <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 24px\">Tracks<\u002Fspan>\n      <div style=\"display:flex;gap:20px;flex-wrap:wrap;margin-bottom:64px\">\n        <sc-for list=\"{{ trackCards }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <div style=\"flex:1;min-width:220px;padding:28px;border-top:4px solid {{ t.color }};background:var(--color-surface);transition:transform .3s;transform:translateY({{ t.offset }})\" style-hover=\"transform:translateY(-8px)\">\n            <h3 style=\"font-size:20px;margin:0 0 8px\">{{ t.name }}<\u002Fh3>\n            <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0\">{{ t.sub }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 24px\">Committee<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px\">\n        <sc-for list=\"{{ committeeMembers }}\" as=\"cm\" hint-placeholder-count=\"4\">\n          <div style=\"transition:transform .3s\" style-hover=\"transform:translateY(-6px)\">\n            <div class=\"grayscale\" style=\"aspect-ratio:1/1;margin-bottom:12px\"><image-slot id=\"committee-photo-{{ $index }}\" shape=\"rect\" placeholder=\"Committee photo\"><\u002Fimage-slot><\u002Fdiv>\n            <p style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;margin:0\">{{ cm.name }}<\u002Fp>\n            <p style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin:2px 0 0\">{{ cm.role }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ EVENTS ============ -->\n  <sc-if value=\"{{ isEvents }}\" hint-placeholder-val=\"{{ false }}\">\n    <main class=\"oso-page\" style=\"max-width:1320px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(20px,5vw,64px)\">\n      <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 16px\">Events calendar<\u002Fspan>\n      <h1 style=\"font-size:clamp(34px,5vw,56px);margin:0 0 16px;letter-spacing:-0.02em\">Upcoming rounds, by date.<\u002Fh1>\n      <p style=\"font-size:16px;max-width:64ch;color:color-mix(in srgb, var(--color-text) 80%, transparent);margin:0 0 40px\">Every round below is an offline, physical event. Location and status are confirmed at least four weeks in advance.<\u002Fp>\n\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ calGoToday }}\">Today<\u002Fbutton>\n          <div style=\"display:flex;gap:2px\">\n            <button type=\"button\" class=\"btn btn-icon\" aria-label=\"Previous\" sc-camel-on-click=\"{{ calPrev }}\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"15 18 9 12 15 6\"><\u002Fpolyline><\u002Fsvg>\n            <\u002Fbutton>\n            <button type=\"button\" class=\"btn btn-icon\" aria-label=\"Next\" sc-camel-on-click=\"{{ calNext }}\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 18 15 12 9 6\"><\u002Fpolyline><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n          <h2 style=\"font-size:20px;margin:0\">{{ calPeriodLabel }}<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n          <sc-raw-select class=\"input\" style=\"max-width:200px\" value=\"{{ calFilterCity }}\" sc-camel-on-change=\"{{ setCalFilterCityFromEvent }}\">\n            <sc-for list=\"{{ cityOptions }}\" as=\"c\" hint-placeholder-count=\"6\"><option value=\"{{ c }}\">{{ c }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <div class=\"seg\">\n            <label class=\"seg-opt\"><input type=\"radio\" name=\"pubcalview\" checked=\"{{ isCalDay }}\" sc-camel-on-change=\"{{ calSetView_day }}\">Day<\u002Flabel>\n            <label class=\"seg-opt\"><input type=\"radio\" name=\"pubcalview\" checked=\"{{ isCalWeek }}\" sc-camel-on-change=\"{{ calSetView_week }}\">Week<\u002Flabel>\n            <label class=\"seg-opt\"><input type=\"radio\" name=\"pubcalview\" checked=\"{{ isCalMonth }}\" sc-camel-on-change=\"{{ calSetView_month }}\">Month<\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"oso-2col\" style=\"display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px\">\n        <div>\n          <sc-if value=\"{{ isCalMonth }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:2px solid var(--color-divider);border-left:2px solid var(--color-divider)\">\n              <sc-for list=\"{{ weekdayLabels }}\" as=\"wd\" hint-placeholder-count=\"7\">\n                <div style=\"padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 60%, transparent);border-right:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)\">{{ wd }}<\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ monthCells }}\" as=\"cell\" hint-placeholder-count=\"42\">\n                <div style=\"min-height:96px;padding:6px 8px;border-right:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider);background:{{ cell.bg }};opacity:{{ cell.dim }}\">\n                  <p style=\"font-size:12px;font-weight:{{ cell.todayWeight }};margin:0 0 6px;color:{{ cell.todayColor }}\">{{ cell.dayNum }}<\u002Fp>\n                  <sc-for list=\"{{ cell.events }}\" as=\"ev\" hint-placeholder-count=\"1\">\n                    <div style=\"background:{{ ev.color }};color:#fff;font-size:11px;padding:3px 6px;margin-bottom:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\" sc-camel-on-click=\"{{ ev.selectFn }}\">{{ ev.title }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ cell.hasMore }}\" hint-placeholder-val=\"{{ false }}\">\n                    <p style=\"font-size:11px;font-weight:700;color:var(--color-accent-700);margin:2px 0 0;cursor:pointer\" sc-camel-on-click=\"{{ cell.openMoreFn }}\">+{{ cell.moreCount }} more<\u002Fp>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isCalWeek }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:2px solid var(--color-divider);border-left:2px solid var(--color-divider)\">\n              <sc-for list=\"{{ weekCells }}\" as=\"cell\" hint-placeholder-count=\"7\">\n                <div style=\"min-height:220px;padding:10px;border-right:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider);background:{{ cell.bg }}\">\n                  <p style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:color-mix(in srgb, var(--color-text) 60%, transparent);margin:0 0 4px\">{{ cell.weekdayShort }}<\u002Fp>\n                  <p style=\"font-size:16px;font-weight:{{ cell.todayWeight }};color:{{ cell.todayColor }};margin:0 0 10px\">{{ cell.dayNum }}<\u002Fp>\n                  <sc-for list=\"{{ cell.events }}\" as=\"ev\" hint-placeholder-count=\"1\">\n                    <div style=\"background:{{ ev.color }};color:#fff;font-size:12px;padding:6px 8px;margin-bottom:4px;cursor:pointer\" sc-camel-on-click=\"{{ ev.selectFn }}\">{{ ev.title }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isCalDay }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border-top:2px solid var(--color-divider);padding-top:20px\">\n              <sc-if value=\"{{ dayHasEvents }}\" hint-placeholder-val=\"{{ false }}\">\n                <sc-for list=\"{{ dayCellEvents }}\" as=\"ev\" hint-placeholder-count=\"1\">\n                  <div style=\"background:{{ ev.color }};color:#fff;padding:16px 18px;margin-bottom:10px;cursor:pointer\" sc-camel-on-click=\"{{ ev.selectFn }}\">\n                    <p style=\"font-family:var(--font-heading);font-weight:700;font-size:15px;margin:0 0 4px\">{{ ev.title }}<\u002Fp>\n                    <p style=\"font-size:12px;opacity:0.85;margin:0\">{{ ev.domain }} · {{ ev.city }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ dayHasNoEvents }}\" hint-placeholder-val=\"{{ true }}\">\n                <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 60%, transparent);margin:0\">No competitions scheduled this day.<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div>\n          <sc-if value=\"{{ isInvitationSelected }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--color-text);color:var(--color-bg);padding:24px;margin-bottom:20px\">\n              <span class=\"tag\" style=\"background:color-mix(in srgb, var(--color-accent) 30%, transparent);color:#fff;margin-bottom:14px\">{{ selectedEvent.domain }}<\u002Fspan>\n              <h3 style=\"font-size:18px;margin:14px 0 10px\">{{ selectedEvent.title }}<\u002Fh3>\n              <p style=\"font-size:13px;opacity:0.85;margin:0 0 4px\">{{ selectedEvent.city }} · {{ selectedEvent.date }}<\u002Fp>\n              <p style=\"font-size:13px;opacity:0.85;margin:0 0 16px\">Entrance fee: {{ selectedEvent.fee }}<\u002Fp>\n              <p style=\"font-size:12px;opacity:0.7;margin:0\">Invitation-only — visible to invited students in their portal.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasSelectedEvent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--color-text);color:var(--color-bg);padding:24px;margin-bottom:20px\">\n              <span class=\"tag\" style=\"background:color-mix(in srgb, {{ selectedEvent.color }} 30%, transparent);color:#fff;margin-bottom:14px\">{{ selectedEvent.domain }}<\u002Fspan>\n              <h3 style=\"font-size:18px;margin:14px 0 10px\">{{ selectedEvent.title }}<\u002Fh3>\n              <p style=\"font-size:13px;opacity:0.85;margin:0 0 4px\">{{ selectedEvent.round }}<\u002Fp>\n              <p style=\"font-size:13px;opacity:0.85;margin:0 0 4px\">{{ selectedEvent.city }} · {{ selectedEvent.date }}<\u002Fp>\n              <p style=\"font-size:13px;opacity:0.85;margin:0 0 16px\">Entrance fee: {{ selectedEvent.fee }}<\u002Fp>\n              <span class=\"tag tag-outline\" style=\"border-color:var(--color-bg);color:var(--color-bg)\">{{ selectedEvent.status }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasNoSelectedEvent }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:24px;background:var(--color-surface);margin-bottom:20px\">\n              <p style=\"font-size:13px;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin:0\">Select a competition on the calendar to see its full details here.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div>\n            <p class=\"card-kicker\" style=\"margin-bottom:12px\">Upcoming<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:2px;background:var(--color-divider)\">\n              <sc-for list=\"{{ topUpcomingEvents }}\" as=\"up\" hint-placeholder-count=\"5\">\n                <div style=\"background:var(--color-bg);padding:12px 14px;cursor:pointer;border-left:3px solid {{ up.color }}\" sc-camel-on-click=\"{{ up.selectFn }}\">\n                  <p style=\"font-family:var(--font-heading);font-weight:700;font-size:13px;margin:0 0 3px\">{{ up.title }}<\u002Fp>\n                  <p style=\"font-size:11px;color:color-mix(in srgb, var(--color-text) 65%, transparent);margin:0\">{{ up.date }} · {{ up.city }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isMoreDayOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"dialog-backdrop\" sc-camel-on-click=\"{{ closeMoreDay }}\">\n          <div class=\"dialog\" sc-camel-on-click=\"{{ stopPropagation }}\">\n            <p class=\"dialog-title\">{{ moreDayLabel }}<\u002Fp>\n            <div class=\"dialog-body\">\n              <sc-for list=\"{{ moreDayEvents }}\" as=\"ev\" hint-placeholder-count=\"4\">\n                <div style=\"background:{{ ev.color }};color:#fff;padding:12px 14px;margin-bottom:8px;cursor:pointer\" sc-camel-on-click=\"{{ ev.selectFn }}\">\n                  <p style=\"font-family:var(--font-heading);font-weight:700;font-size:14px;margin:0 0 3px\">{{ ev.title }}<\u002Fp>\n                  <p style=\"font-size:12px;opacity:0.85;margin:0\">{{ ev.city }} · {{ ev.fee }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div class=\"dialog-actions\">\n              <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ closeMoreDay }}\">Close<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ TALKS & BLOG ============ -->\n  <sc-if value=\"{{ isTalks }}\" hint-placeholder-val=\"{{ false }}\">\n    <main class=\"oso-page\" style=\"max-width:1320px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(20px,5vw,64px)\">\n      <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 16px\">Blog<\u002Fspan>\n      <h1 style=\"font-size:clamp(34px,5vw,56px);margin:0 0 16px;letter-spacing:-0.02em\">Ideas from the people building it.<\u002Fh1>\n      <p style=\"font-size:16px;max-width:64ch;color:color-mix(in srgb, var(--color-text) 80%, transparent);margin:0 0 48px\">Anyone can submit a blog. Articles go live only after admin approval.<\u002Fp>\n\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;gap:16px;flex-wrap:wrap\">\n        <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700)\">News &amp; articles<\u002Fspan>\n        <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ goContact }}\">Submit a blog<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px\">\n        <sc-for list=\"{{ blogCategories }}\" as=\"bc\" hint-placeholder-count=\"5\">\n          <button type=\"button\" class=\"btn\" style=\"padding:8px 16px;font-size:13px;background:{{ bc.bg }};color:{{ bc.fg }};border:2px solid var(--color-divider)\" sc-camel-on-click=\"{{ bc.selectFn }}\">{{ bc.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasFeaturedBlog }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(240px,1fr);gap:32px;margin-bottom:48px;cursor:pointer\" sc-camel-on-click=\"{{ featuredBlog.openFn }}\">\n          <div class=\"grayscale\" style=\"aspect-ratio:16/10;transition:transform .4s\" style-hover=\"transform:translateY(-6px)\">\n            <image-slot id=\"blog-featured-photo\" shape=\"rect\" placeholder=\"Blog cover photo\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div>\n            <span class=\"tag tag-accent\" style=\"margin-bottom:14px\">{{ featuredBlog.category }}<\u002Fspan>\n            <h3 style=\"font-size:28px;margin:14px 0 10px\">{{ featuredBlog.title }}<\u002Fh3>\n            <p style=\"font-size:14px;line-height:1.6;color:color-mix(in srgb, var(--color-text) 78%, transparent);margin:0 0 14px\">{{ featuredBlog.excerpt }}<\u002Fp>\n            <p style=\"font-size:13px;color:color-mix(in srgb, var(--color-text) 65%, transparent);margin:0\">{{ featuredBlog.author }} · {{ featuredBlog.date }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px 28px\">\n        <sc-for list=\"{{ filteredBlogsRest }}\" as=\"b\" hint-placeholder-count=\"3\">\n          <div style=\"transition:transform .3s;cursor:pointer\" style-hover=\"transform:translateY(-6px)\" sc-camel-on-click=\"{{ b.openFn }}\">\n            <div class=\"grayscale\" style=\"aspect-ratio:16/10;margin-bottom:14px\"><image-slot id=\"blog-thumb-{{ $index }}\" shape=\"rect\" placeholder=\"Article cover photo\"><\u002Fimage-slot><\u002Fdiv>\n            <span class=\"tag tag-neutral\" style=\"margin-bottom:10px\">{{ b.category }}<\u002Fspan>\n            <h3 style=\"font-family:var(--font-heading);font-weight:800;font-size:17px;margin:10px 0 6px\">{{ b.title }}<\u002Fh3>\n            <p style=\"font-size:13px;line-height:1.55;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0 0 10px\">{{ b.excerpt }}<\u002Fp>\n            <p style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 60%, transparent);margin:0\">{{ b.author }} · {{ b.date }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ noFilteredBlogs }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 60%, transparent);margin:0\">No articles in this category yet.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ BLOG POST ============ -->\n  <sc-if value=\"{{ isBlogPost }}\" hint-placeholder-val=\"{{ false }}\">\n    <main class=\"oso-page\">\n      <div class=\"grayscale\" style=\"height:clamp(200px,28vw,320px)\"><image-slot id=\"blog-post-hero-{{ activeBlog.id }}\" shape=\"rect\" placeholder=\"Banner image\"><\u002Fimage-slot><\u002Fdiv>\n      <div style=\"max-width:820px;margin:0 auto;padding:clamp(32px,5vw,56px) clamp(20px,5vw,64px)\">\n        <button type=\"button\" class=\"btn btn-ghost\" style=\"padding-left:0;margin-bottom:20px\" sc-camel-on-click=\"{{ goTalks }}\">← Back to blog<\u002Fbutton>\n        <span class=\"tag tag-accent\" style=\"margin-bottom:16px\">{{ activeBlog.category }}<\u002Fspan>\n        <h1 style=\"font-size:clamp(28px,4.5vw,42px);margin:16px 0 14px;letter-spacing:-0.02em\">{{ activeBlog.title }}<\u002Fh1>\n        <p style=\"font-size:13px;color:color-mix(in srgb, var(--color-text) 65%, transparent);margin:0 0 40px\">{{ activeBlog.author }} · {{ activeBlog.date }}<\u002Fp>\n\n        <sc-for list=\"{{ activeBlogBody }}\" as=\"para\" hint-placeholder-count=\"3\">\n          <p style=\"font-size:16px;line-height:1.75;color:color-mix(in srgb, var(--color-text) 88%, transparent);margin:0 0 22px\">{{ para }}<\u002Fp>\n        <\u002Fsc-for>\n\n        <p class=\"card-kicker\" style=\"margin:40px 0 16px\">Gallery<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px\">\n          <sc-for list=\"{{ activeBlogImages }}\" as=\"img\" hint-placeholder-count=\"3\">\n            <div class=\"grayscale\" style=\"aspect-ratio:4/3\"><image-slot id=\"blog-post-gallery-{{ activeBlog.id }}-{{ $index }}\" shape=\"rect\" placeholder=\"Photo\"><\u002Fimage-slot><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ LEADERBOARD ============ -->\n  <sc-if value=\"{{ isLeaderboard }}\" hint-placeholder-val=\"{{ false }}\">\n    <main class=\"oso-page\" style=\"max-width:1320px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(20px,5vw,64px)\">\n      <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 16px\">Leaderboard<\u002Fspan>\n      <h1 style=\"font-size:clamp(34px,5vw,56px);margin:0 0 16px;letter-spacing:-0.02em\">Top students, by score.<\u002Fh1>\n      <p style=\"font-size:16px;max-width:64ch;color:color-mix(in srgb, var(--color-text) 80%, transparent);margin:0 0 48px\">Score aggregates competitions, daily quizzes, and course completion across the VIBGYOR ladder.<\u002Fp>\n\n      <div style=\"display:flex;align-items:flex-end;gap:16px;margin-bottom:56px;flex-wrap:wrap\">\n        <sc-for list=\"{{ leaderboardTop3 }}\" as=\"l\" hint-placeholder-count=\"3\">\n          <div style=\"flex:1;min-width:180px;order:{{ l.order }};display:flex;flex-direction:column;align-items:center;transition:transform .3s\" style-hover=\"transform:translateY(-6px)\">\n            <p style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;margin:0 0 8px\">{{ l.name }}<\u002Fp>\n            <p style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 65%, transparent);margin:0 0 12px;text-align:center\">{{ l.institute }}<\u002Fp>\n            <div style=\"width:100%;height:{{ l.podiumHeight }};background:var(--color-text);color:var(--color-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-top:4px solid {{ l.color }}\">\n              <p style=\"font-family:var(--font-heading);font-weight:800;font-size:36px;color:{{ l.color }};margin:0\">#{{ l.rank }}<\u002Fp>\n              <p style=\"font-size:13px;opacity:0.8;margin:0\">{{ l.score }} pts<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px\">\n        <sc-for list=\"{{ leaderboardBranchOptions }}\" as=\"bf\" hint-placeholder-count=\"5\">\n          <button type=\"button\" class=\"btn\" style=\"padding:8px 16px;font-size:13px;background:{{ bf.bg }};color:{{ bf.fg }};border:2px solid var(--color-divider)\" sc-camel-on-click=\"{{ bf.selectFn }}\">{{ bf.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"overflow-x:auto\"><sc-raw-table class=\"table\" style=\"margin-bottom:64px;min-width:600px\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th>Rank<\u002Fsc-raw-th><sc-raw-th>Student<\u002Fsc-raw-th><sc-raw-th>Institute<\u002Fsc-raw-th><sc-raw-th>Track<\u002Fsc-raw-th><sc-raw-th>Domain<\u002Fsc-raw-th><sc-raw-th>Score<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ leaderboardRestFiltered }}\" as=\"l\" hint-placeholder-count=\"5\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"font-family:var(--font-heading);font-weight:800;color:var(--color-accent)\">#{{ l.rank }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"font-weight:600\">{{ l.name }}<\u002Fsc-raw-td>\n              <sc-raw-td>{{ l.institute }}<\u002Fsc-raw-td>\n              <sc-raw-td>{{ l.track }}<\u002Fsc-raw-td>\n              <sc-raw-td>{{ l.domain }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"font-weight:700\">{{ l.score }}<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table><\u002Fdiv>\n\n      <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 20px\">The VIBGYOR course ladder<\u002Fspan>\n      <p style=\"font-size:15px;max-width:64ch;color:color-mix(in srgb, var(--color-text) 78%, transparent);margin:0 0 20px\">Seven interdependent levels, colour-coded to the OSO mark. Completing one unlocks the next.<\u002Fp>\n      <div style=\"display:flex;gap:2px;flex-wrap:wrap\">\n        <sc-for list=\"{{ vibgyor }}\" as=\"v\" hint-placeholder-count=\"7\">\n          <div style=\"flex:1;min-width:130px;padding:16px;color:#fff;background:{{ v.color }};transition:transform .2s\" style-hover=\"transform:translateY(-6px)\">\n            <p style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.85;margin:0 0 4px\">Level {{ v.level }}<\u002Fp>\n            <p style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;margin:0\">{{ v.name }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n<!-- ============ REGISTER ============ -->\n  <sc-if value=\"{{ isRegisterPage }}\" hint-placeholder-val=\"{{ false }}\">\n<style>\n    .reg-field-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; }\n  <\u002Fstyle>\n  <main class=\"oso-page\" style=\"max-width:1320px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(20px,5vw,64px)\">\n\n<sc-if value=\"{{ isRegAtFirstStep }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"max-width:640px;margin:0 auto 44px;text-align:center\">\n        <div style=\"display:flex;justify-content:center;gap:0;border-bottom:2px solid var(--color-divider)\">\n          <button type=\"button\" style=\"background:none;border:none;padding:14px 28px;font-family:var(--font-heading);font-weight:700;font-size:14px;cursor:pointer;color:{{ regTabStudentColor }};border-bottom:3px solid {{ regTabStudentBorder }};margin-bottom:-2px\" sc-camel-on-click=\"{{ goRegisterStudent }}\">Student<\u002Fbutton>\n          <button type=\"button\" style=\"background:none;border:none;padding:14px 28px;font-family:var(--font-heading);font-weight:700;font-size:14px;cursor:pointer;color:{{ regTabMentorColor }};border-bottom:3px solid {{ regTabMentorBorder }};margin-bottom:-2px\" sc-camel-on-click=\"{{ goRegisterMentor }}\">Mentor<\u002Fbutton>\n          <button type=\"button\" style=\"background:none;border:none;padding:14px 28px;font-family:var(--font-heading);font-weight:700;font-size:14px;cursor:pointer;color:{{ regTabInstitutionColor }};border-bottom:3px solid {{ regTabInstitutionBorder }};margin-bottom:-2px\" sc-camel-on-click=\"{{ goRegisterInstitution }}\">College / Institution<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n<\u002Fsc-if>\n\n      <sc-if value=\"{{ isRegTabStudent }}\" hint-placeholder-val=\"{{ true }}\">\n\n      <sc-if value=\"{{ isRegStageEmail }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"max-width:440px;margin:0 auto\">\n          <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 12px\">Step 1 of 3 · Verify email<\u002Fspan>\n          <h1 style=\"font-size:clamp(28px,4vw,
