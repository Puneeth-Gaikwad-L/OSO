40px);margin:0 0 12px;letter-spacing:-0.02em\">Registering as Student<\u002Fh1>\n          <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0 0 28px\">We'll send a one-time code to confirm it's really you before you fill in your details.<\u002Fp>\n          <div class=\"field\"><label>Email address<\u002Flabel><input class=\"input\" type=\"email\" placeholder=\"you@example.com\" value=\"{{ registerEmail }}\" sc-camel-on-change=\"{{ setRegisterEmail }}\"><\u002Fdiv>\n          <sc-if value=\"{{ registerEmailError }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:12px;color:var(--color-accent-700);margin:8px 0 0\">Enter a valid email address.<\u002Fp><\u002Fsc-if>\n          <button type=\"button\" class=\"btn btn-primary btn-block\" style=\"margin-top:20px\" sc-camel-on-click=\"{{ sendOtp }}\">Send OTP<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRegStageOtp }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:440px;margin:0 auto\">\n          <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 12px\">Step 2 of 3 · Enter OTP<\u002Fspan>\n          <h1 style=\"font-size:clamp(28px,4vw,40px);margin:0 0 12px;letter-spacing:-0.02em\">Enter the code<\u002Fh1>\n          <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0 0 8px\">We sent a 6-digit code to <strong>{{ registerEmail }}<\u002Fstrong>.<\u002Fp>\n          <p style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin:0 0 28px\">Demo prototype — the code is 123456.<\u002Fp>\n          <div class=\"field\"><label>One-time code<\u002Flabel><input class=\"input\" type=\"text\" sc-camel-max-length=\"6\" placeholder=\"6-digit code\" value=\"{{ registerOtp }}\" sc-camel-on-change=\"{{ setRegisterOtp }}\"><\u002Fdiv>\n          <sc-if value=\"{{ registerOtpError }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:12px;color:var(--color-accent-700);margin:8px 0 0\">Incorrect code. Try again.<\u002Fp><\u002Fsc-if>\n          <button type=\"button\" class=\"btn btn-primary btn-block\" style=\"margin-top:20px\" sc-camel-on-click=\"{{ verifyOtp }}\">Verify &amp; continue<\u002Fbutton>\n          <div style=\"display:flex;justify-content:space-between;margin-top:12px\">\n            <button type=\"button\" class=\"btn btn-ghost\" style=\"font-size:12px\" sc-camel-on-click=\"{{ backToEmailStep }}\">Change email<\u002Fbutton>\n            <button type=\"button\" class=\"btn btn-ghost\" style=\"font-size:12px\" sc-camel-on-click=\"{{ sendOtp }}\">Resend code<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRegStageForm }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:760px;margin:0 auto\">\n        <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 12px\">Step 3 of 3 · Your details<\u002Fspan>\n        <h1 style=\"font-size:clamp(28px,4.2vw,40px);margin:0 0 40px;max-width:24ch;letter-spacing:-0.02em\">Tell us about yourself.<\u002Fh1>\n\n        <div style=\"background:var(--color-surface);border-top:4px solid var(--color-accent);padding:clamp(24px,4vw,36px);margin-bottom:24px\">\n          <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:24px\">\n            <span style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--color-accent)\">01<\u002Fspan>\n            <h3 style=\"font-size:19px;margin:0\">Personal details<\u002Fh3>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:24px;flex-wrap:wrap;margin-bottom:20px\">\n            <div class=\"grayscale\" style=\"width:96px;height:96px;flex-shrink:0\"><image-slot id=\"register-profile-photo\" shape=\"circle\" placeholder=\"Profile photo\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"flex:1;min-width:200px\" class=\"reg-field-grid\">\n              <div class=\"field\"><label>Full Name<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"Your full name\"><\u002Fdiv>\n              <div class=\"field\"><label>Date of Birth<\u002Flabel><input class=\"input\" type=\"date\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"reg-field-grid\">\n            <div class=\"field\"><label>Gender<\u002Flabel>\n              <div class=\"seg\">\n                <label class=\"seg-opt\"><input type=\"radio\" name=\"gender\" sc-camel-default-checked=\"{{ true }}\">Male<\u002Flabel>\n                <label class=\"seg-opt\"><input type=\"radio\" name=\"gender\">Female<\u002Flabel>\n                <label class=\"seg-opt\"><input type=\"radio\" name=\"gender\">Other<\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\"><label>Email<\u002Flabel><input class=\"input\" type=\"email\" value=\"{{ registerEmail }}\" disabled=\"{{ true }}\"><\u002Fdiv>\n            <div class=\"field\"><label>Mobile Number<\u002Flabel><input class=\"input\" type=\"tel\" placeholder=\"10-digit mobile number\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-top:20px\"><label>Bio<\u002Flabel><textarea class=\"input\" rows=\"3\" placeholder=\"A couple of lines about you — interests, goals, what you're working on\"><\u002Ftextarea><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--color-surface);border-top:4px solid var(--color-accent);padding:clamp(24px,4vw,36px);margin-bottom:24px\">\n          <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:24px\">\n            <span style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--color-accent)\">02<\u002Fspan>\n            <h3 style=\"font-size:19px;margin:0\">Address details<\u002Fh3>\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:20px\"><label>Address<\u002Flabel><textarea class=\"input\" rows=\"2\" placeholder=\"House / street / area\"><\u002Ftextarea><\u002Fdiv>\n          <div class=\"reg-field-grid\">\n            <div class=\"field\"><label>City<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"City\"><\u002Fdiv>\n            <div class=\"field\"><label>State<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"State\"><\u002Fdiv>\n            <div class=\"field\"><label>Country<\u002Flabel><input class=\"input\" type=\"text\" sc-camel-default-value=\"India\"><\u002Fdiv>\n            <div class=\"field\"><label>Pincode<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"6-digit pincode\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--color-surface);border-top:4px solid var(--color-accent);padding:clamp(24px,4vw,36px);margin-bottom:24px\">\n          <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:24px\">\n            <span style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--color-accent)\">03<\u002Fspan>\n            <h3 style=\"font-size:19px;margin:0\">Academic details<\u002Fh3>\n          <\u002Fdiv>\n          <div class=\"reg-field-grid\">\n            <div class=\"field\"><label>College Name<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"Your college / institute\"><\u002Fdiv>\n            <div class=\"field\"><label>University / Board<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"Affiliating university or board\"><\u002Fdiv>\n            <div class=\"field\"><label>Course Type<\u002Flabel>\n              <div class=\"seg\">\n                <label class=\"seg-opt\"><input type=\"radio\" name=\"courseType\" checked=\"{{ isCourseEngineering }}\" sc-camel-on-change=\"{{ setCourseTypeEngineering }}\">Engineering<\u002Flabel>\n                <label class=\"seg-opt\"><input type=\"radio\" name=\"courseType\" checked=\"{{ isCourseDiploma }}\" sc-camel-on-change=\"{{ setCourseTypeDiploma }}\">Diploma<\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\"><label>Branch<\u002Flabel>\n              <sc-raw-select class=\"input\">\n                <sc-for list=\"{{ branchOptions }}\" as=\"b\" hint-placeholder-count=\"5\"><option value=\"{{ b }}\">{{ b }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div class=\"field\"><label>Year of Study<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. 2nd Year\"><\u002Fdiv>\n            <div class=\"field\"><label>Semester<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. 4th Semester\"><\u002Fdiv>\n            <div class=\"field\"><label>Student ID / USN / Roll Number<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"Your ID number\"><\u002Fdiv>\n            <div class=\"field\"><label>Academic Year<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. 2026-2027\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--color-surface);border-top:4px solid var(--color-accent);padding:clamp(24px,4vw,36px);margin-bottom:32px\">\n          <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:6px\">\n            <span style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--color-accent)\">04<\u002Fspan>\n            <h3 style=\"font-size:19px;margin:0\">Student interests<\u002Fh3>\n          <\u002Fdiv>\n          <p style=\"font-size:13px;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin:0 0 20px;padding-left:28px\">Select all that apply.<\u002Fp>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <sc-for list=\"{{ interestChips }}\" as=\"i\" hint-placeholder-count=\"10\">\n              <button type=\"button\" class=\"tag\" style=\"cursor:pointer;border:2px solid var(--color-divider);transition:transform .15s;background:{{ i.bg }};color:{{ i.fg }}\" style-hover=\"transform:translateY(-2px)\" sc-camel-on-click=\"{{ i.toggleFn }}\">{{ i.name }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <button type=\"button\" class=\"btn btn-primary btn-block\" style=\"transition:transform .2s\" style-hover=\"transform:translateY(-2px)\" sc-camel-on-click=\"{{ completeRegistration }}\">Complete registration<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRegStageInstitution }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:520px;margin:0 auto\">\n          <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 12px\">Optional<\u002Fspan>\n          <h1 style=\"font-size:clamp(26px,4vw,36px);margin:0 0 12px;letter-spacing:-0.02em\">Link to your institution?<\u002Fh1>\n          <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0 0 24px\">Linking lets your college tag you to its roster and lets you refer classmates. You can also do this later from your profile.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:2px;background:var(--color-divider);margin-bottom:20px\">\n            <sc-for list=\"{{ institutionChoices }}\" as=\"inst\" hint-placeholder-count=\"5\">\n              <div style=\"background:var(--color-bg);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:16px\">\n                <span style=\"font-size:14px;font-weight:600\">{{ inst.name }}<\u002Fspan>\n                <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ inst.linkFn }}\">Link<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button type=\"button\" class=\"btn btn-ghost btn-block\" sc-camel-on-click=\"{{ skipRegInstitution }}\">Skip — continue as an independent student<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRegStageDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:440px;margin:0 auto;text-align:center;padding:40px 0\">\n          <svg width=\"48\" height=\"48\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin:0 auto 20px\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polyline points=\"8 12 11 15 16 9\"><\u002Fpolyline><\u002Fsvg>\n          <h1 style=\"font-size:clamp(26px,4vw,36px);margin:0 0 12px\">You're registered<\u002Fh1>\n          <sc-if value=\"{{ hasRegInstitution }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0 0 28px\">You're linked to {{ regInstitution }}. Head to your dashboard to pick a championship track and start competing.<\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasNoRegInstitution }}\" hint-placeholder-val=\"{{ true }}\">\n            <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0 0 28px\">You're registered as an independent student. Link to an institution anytime from your Profile. Head to your dashboard to pick a championship track and start competing.<\u002Fp>\n          <\u002Fsc-if>\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ goPortalStudent }}\">Go to student portal<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRegTabMentor }}\" hint-placeholder-val=\"{{ false }}\">\n\n      <sc-if value=\"{{ isMentorRegStageEmail }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:440px;margin:0 auto\">\n          <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 12px\">Step 1 of 3 · Verify email<\u002Fspan>\n          <h1 style=\"font-size:clamp(28px,4vw,40px);margin:0 0 12px;letter-spacing:-0.02em\">Registering as Mentor<\u002Fh1>\n          <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0 0 28px\">We'll send a one-time code to confirm it's really you before you fill in your mentor profile.<\u002Fp>\n          <div class=\"field\"><label>Email address<\u002Flabel><input class=\"input\" type=\"email\" placeholder=\"you@example.com\" value=\"{{ mentorRegEmail }}\" sc-camel-on-change=\"{{ setMentorRegEmail }}\"><\u002Fdiv>\n          <sc-if value=\"{{ mentorRegEmailError }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:12px;color:var(--color-accent-700);margin:8px 0 0\">Enter a valid email address.<\u002Fp><\u002Fsc-if>\n          <button type=\"button\" class=\"btn btn-primary btn-block\" style=\"margin-top:20px\" sc-camel-on-click=\"{{ sendMentorOtp }}\">Send OTP<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isMentorRegStageOtp }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:440px;margin:0 auto\">\n          <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 12px\">Step 2 of 3 · Enter OTP<\u002Fspan>\n          <h1 style=\"font-size:clamp(28px,4vw,40px);margin:0 0 12px;letter-spacing:-0.02em\">Enter the code<\u002Fh1>\n          <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0 0 8px\">We sent a 6-digit code to <strong>{{ mentorRegEmail }}<\u002Fstrong>.<\u002Fp>\n          <p style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin:0 0 28px\">Demo prototype — the code is 123456.<\u002Fp>\n          <div class=\"field\"><label>One-time code<\u002Flabel><input class=\"input\" type=\"text\" sc-camel-max-length=\"6\" placeholder=\"6-digit code\" value=\"{{ mentorRegOtp }}\" sc-camel-on-change=\"{{ setMentorRegOtp }}\"><\u002Fdiv>\n          <sc-if value=\"{{ mentorRegOtpError }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:12px;color:var(--color-accent-700);margin:8px 0 0\">Incorrect code. Try again.<\u002Fp><\u002Fsc-if>\n          <button type=\"button\" class=\"btn btn-primary btn-block\" style=\"margin-top:20px\" sc-camel-on-click=\"{{ verifyMentorOtp }}\">Verify &amp; continue<\u002Fbutton>\n          <div style=\"display:flex;justify-content:space-between;margin-top:12px\">\n            <button type=\"button\" class=\"btn btn-ghost\" style=\"font-size:12px\" sc-camel-on-click=\"{{ backToMentorEmailStep }}\">Change email<\u002Fbutton>\n            <button type=\"button\" class=\"btn btn-ghost\" style=\"font-size:12px\" sc-camel-on-click=\"{{ sendMentorOtp }}\">Resend code<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isMentorRegStageForm }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:760px;margin:0 auto\">\n        <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 12px\">Step 3 of 3 · Your mentor profile<\u002Fspan>\n        <h1 style=\"font-size:clamp(28px,4.2vw,40px);margin:0 0 40px;max-width:26ch;letter-spacing:-0.02em\">Tell us about your expertise.<\u002Fh1>\n\n        <div style=\"background:var(--color-surface);border-top:4px solid var(--color-accent);padding:clamp(24px,4vw,36px);margin-bottom:24px\">\n          <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:24px\">\n            <span style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--color-accent)\">01<\u002Fspan>\n            <h3 style=\"font-size:19px;margin:0\">Personal details<\u002Fh3>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:24px;flex-wrap:wrap;margin-bottom:20px\">\n            <div class=\"grayscale\" style=\"width:96px;height:96px;flex-shrink:0\"><image-slot id=\"mentor-register-profile-photo\" shape=\"circle\" placeholder=\"Profile photo\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"flex:1;min-width:200px\" class=\"reg-field-grid\">\n              <div class=\"field\"><label>Full Name<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"Your full name\"><\u002Fdiv>\n              <div class=\"field\"><label>Mobile Number<\u002Flabel><input class=\"input\" type=\"tel\" placeholder=\"10-digit mobile number\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"reg-field-grid\">\n            <div class=\"field\"><label>Email<\u002Flabel><input class=\"input\" type=\"email\" value=\"{{ mentorRegEmail }}\" disabled=\"{{ true }}\"><\u002Fdiv>\n            <div class=\"field\"><label>Gender<\u002Flabel>\n              <div class=\"seg\">\n                <label class=\"seg-opt\"><input type=\"radio\" name=\"mentorGender\" sc-camel-default-checked=\"{{ true }}\">Male<\u002Flabel>\n                <label class=\"seg-opt\"><input type=\"radio\" name=\"mentorGender\">Female<\u002Flabel>\n                <label class=\"seg-opt\"><input type=\"radio\" name=\"mentorGender\">Other<\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\"><label>Location<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"City, State\"><\u002Fdiv>\n            <div class=\"field\"><label>Professional Category<\u002Flabel>\n              <sc-raw-select class=\"input\">\n                <sc-for list=\"{{ professionalCategories }}\" as=\"c\" hint-placeholder-count=\"7\"><option value=\"{{ c }}\">{{ c }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--color-surface);border-top:4px solid var(--color-accent);padding:clamp(24px,4vw,36px);margin-bottom:24px\">\n          <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:24px\">\n            <span style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--color-accent)\">02<\u002Fspan>\n            <h3 style=\"font-size:19px;margin:0\">Educational details<\u002Fh3>\n          <\u002Fdiv>\n          <div class=\"reg-field-grid\">\n            <div class=\"field\"><label>Highest Qualification<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. M.Tech, PhD\"><\u002Fdiv>\n            <div class=\"field\"><label>Degree<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. B.E / B.Tech\"><\u002Fdiv>\n            <div class=\"field\"><label>Specialization<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. Computer Science\"><\u002Fdiv>\n            <div class=\"field\"><label>University<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"Your university\"><\u002Fdiv>\n            <div class=\"field\" style=\"grid-column:1/-1\"><label>Certifications<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. AWS Certified, PMP\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--color-surface);border-top:4px solid var(--color-accent);padding:clamp(24px,4vw,36px);margin-bottom:24px\">\n          <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:24px\">\n            <span style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--color-accent)\">03<\u002Fspan>\n            <h3 style=\"font-size:19px;margin:0\">Professional details<\u002Fh3>\n          <\u002Fdiv>\n          <div class=\"reg-field-grid\">\n            <div class=\"field\"><label>Current Organization / College<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"Where you currently work\"><\u002Fdiv>\n            <div class=\"field\"><label>Designation<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"Your title\"><\u002Fdiv>\n            <div class=\"field\"><label>Total Experience<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. 8 years\"><\u002Fdiv>\n            <div class=\"field\"><label>Teaching Experience<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. 3 years\"><\u002Fdiv>\n            <div class=\"field\"><label>Industry Experience<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. 5 years\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--color-surface);border-top:4px solid var(--color-accent);padding:clamp(24px,4vw,36px);margin-bottom:32px\">\n          <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:24px\">\n            <span style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;color:var(--color-accent)\">04<\u002Fspan>\n            <h3 style=\"font-size:19px;margin:0\">Engineering / Diploma specialization<\u002Fh3>\n          <\u002Fdiv>\n          <div class=\"reg-field-grid\">\n            <div class=\"field\"><label>Branch<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. Computer Science Engineering\"><\u002Fdiv>\n            <div class=\"field\"><label>Subjects<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. Data Structures, DBMS\"><\u002Fdiv>\n            <div class=\"field\"><label>Areas of Expertise<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. Machine Learning, IoT\"><\u002Fdiv>\n            <div class=\"field\"><label>Technical Skills<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. Python, Java, MATLAB\"><\u002Fdiv>\n            <div class=\"field\"><label>Interests<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"e.g. Mentoring, Research\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <button type=\"button\" class=\"btn btn-primary btn-block\" style=\"transition:transform .2s\" style-hover=\"transform:translateY(-2px)\" sc-camel-on-click=\"{{ submitMentorRegistration }}\">Submit profile for review<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isMentorRegStagePending }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:460px;margin:0 auto;text-align:center;padding:40px 0\">\n          <svg width=\"48\" height=\"48\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin:0 auto 20px\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polyline points=\"12 6 12 12 16 14\"><\u002Fpolyline><\u002Fsvg>\n          <h1 style=\"font-size:clamp(26px,4vw,36px);margin:0 0 12px\">Profile submitted for review<\u002Fh1>\n          <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0 0 28px\">Thanks — our team will verify your details and approve your mentor account. You'll get an email once it's active, and can then log in and start accepting student requests.<\u002Fp>\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ goHome }}\">Back to home<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRegTabInstitution }}\" hint-placeholder-val=\"{{ false }}\">\n      <sc-if value=\"{{ isInstRegStageForm }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:760px;margin:0 auto\">\n        <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 12px\">Institution registration<\u002Fspan>\n        <h1 style=\"font-size:clamp(28px,4.2vw,40px);margin:0 0 40px;max-width:24ch;letter-spacing:-0.02em\">Register your college.<\u002Fh1>\n\n        <div style=\"background:var(--color-surface);border-top:4px solid var(--color-accent);padding:clamp(24px,4vw,36px);margin-bottom:32px\">\n          <div style=\"display:flex;gap:24px;flex-wrap:wrap;margin-bottom:20px\">\n            <div class=\"grayscale\" style=\"width:96px;height:96px;flex-shrink:0\"><image-slot id=\"institution-logo\" shape=\"rect\" placeholder=\"College logo\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"flex:1;min-width:200px\" class=\"reg-field-grid\">\n              <div class=\"field\"><label>College / Institution Name<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"Your college's full name\"><\u002Fdiv>\n              <div class=\"field\"><label>Pincode<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"6-digit pincode\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom:20px\"><label>Address<\u002Flabel><textarea class=\"input\" rows=\"2\" placeholder=\"Campus address\"><\u002Ftextarea><\u002Fdiv>\n          <div class=\"reg-field-grid\">\n            <div class=\"field\"><label>Principal's Name<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"Principal's full name\"><\u002Fdiv>\n            <div class=\"field\"><label>Faculty Ambassador's Name<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"Faculty ambassador's full name\"><\u002Fdiv>\n            <div class=\"field\"><label>Faculty Ambassador's Email<\u002Flabel><input class=\"input\" type=\"email\" placeholder=\"ambassador@college.edu\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <button type=\"button\" class=\"btn btn-primary btn-block\" style=\"transition:transform .2s\" style-hover=\"transform:translateY(-2px)\" sc-camel-on-click=\"{{ submitInstitutionRegistration }}\">Submit for review<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isInstRegStagePending }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:460px;margin:0 auto;text-align:center;padding:40px 0\">\n          <svg width=\"48\" height=\"48\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin:0 auto 20px\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polyline points=\"12 6 12 12 16 14\"><\u002Fpolyline><\u002Fsvg>\n          <h1 style=\"font-size:clamp(26px,4vw,36px);margin:0 0 12px\">Submitted for review<\u002Fh1>\n          <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0 0 28px\">Our team will verify your institution's details. Once approved, your Faculty Ambassador can log in and switch to the Institution Admin view to tag students and manage your board.<\u002Fp>\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ goHome }}\">Back to home<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ CONTACT ============ -->\n  <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n    <main class=\"oso-page\" style=\"max-width:1320px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(20px,5vw,64px)\">\n      <span style=\"display:block;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 16px\">Contact<\u002Fspan>\n      <h1 style=\"font-size:clamp(34px,5vw,56px);margin:0 0 48px;max-width:22ch;letter-spacing:-0.02em\">Get in touch.<\u002Fh1>\n\n      <div class=\"oso-2col\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,1fr);gap:56px\">\n        <form style=\"display:flex;flex-direction:column;gap:16px\">\n          <div class=\"field\"><label>Full name<\u002Flabel><input class=\"input\" type=\"text\" placeholder=\"Your name\"><\u002Fdiv>\n          <div class=\"field\"><label>Email<\u002Flabel><input class=\"input\" type=\"email\" placeholder=\"you@example.com\"><\u002Fdiv>\n          <div class=\"field\"><label>Type<\u002Flabel>\n            <sc-raw-select class=\"input\" value=\"{{ contactType }}\" sc-camel-on-change=\"{{ setContactType }}\">\n              <option value=\"Message\">Message<\u002Foption>\n              <option value=\"Complaint\">Complaint<\u002Foption>\n              <option value=\"Suggestion\">Suggestion<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div class=\"field\"><label>{{ contactType }}<\u002Flabel><textarea class=\"input\" rows=\"4\" placeholder=\"{{ contactPlaceholder }}\"><\u002Ftextarea><\u002Fdiv>\n          <button type=\"button\" class=\"btn btn-primary btn-block\" style=\"transition:transform .2s\" style-hover=\"transform:translateY(-2px)\">Submit<\u002Fbutton>\n        <\u002Fform>\n        <div>\n          <div style=\"padding:28px;background:var(--color-text);color:var(--color-bg);margin-bottom:24px;transform:translateY(-8px)\">\n            <p style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;margin:0 0 12px\">Direct contact<\u002Fp>\n            <p style=\"font-size:14px;margin:0 0 6px;opacity:0.9\">hello@omniskillsolympiad.com<\u002Fp>\n            <p style=\"font-size:14px;margin:0 0 6px;opacity:0.9\">Bengaluru, India<\u002Fp>\n            <p style=\"font-size:14px;margin:0;opacity:0.9\">Mon–Fri, 10am–6pm IST<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:28px;border:2px solid var(--color-divider)\">\n            <p style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;margin:0 0 12px\">FAQ<\u002Fp>\n            <p style=\"font-size:13px;font-weight:600;margin:0 0 4px\">Is there an entrance fee?<\u002Fp>\n            <p style=\"font-size:13px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0 0 14px\">Yes, a nominal per-competition entrance fee applies and is shown on each listing before you register.<\u002Fp>\n            <p style=\"font-size:13px;font-weight:600;margin:0 0 4px\">Are events held online?<\u002Fp>\n            <p style=\"font-size:13px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0\">No. Every OSO round is offline and physical.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"border-top:2px solid var(--color-divider);padding:48px clamp(20px,5vw,64px) 28px\">\n    <div style=\"max-width:1320px;margin:0 auto\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:32px;margin-bottom:32px\">\n        <div>\n          <p style=\"font-family:var(--font-heading);font-weight:800;font-size:16px;margin:0 0 4px\">OMNI SKILLS OLYMPIAD<\u002Fp>\n          <p style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin:0\">infinite opportunities<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin:0 0 12px\">Platform<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ goAbout }}\" style=\"font-size:14px;color:var(--color-text)\">About<\u002Fa>\n            <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ goEvents }}\" style=\"font-size:14px;color:var(--color-text)\">Events<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin:0 0 12px\">Community<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ goTalks }}\" style=\"font-size:14px;color:var(--color-text)\">Blog<\u002Fa>\n            <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ goLeaderboard }}\" style=\"font-size:14px;color:var(--color-text)\">Leaderboard<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin:0 0 12px\">Register<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ goRegisterStudent }}\" style=\"font-size:14px;color:var(--color-text)\">Student<\u002Fa>\n            <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ goRegisterMentor }}\" style=\"font-size:14px;color:var(--color-text)\">Mentor<\u002Fa>\n            <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ goRegisterInstitution }}\" style=\"font-size:14px;color:var(--color-text)\">Institution<\u002Fa>\n            <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ goContact }}\" style=\"font-size:14px;color:var(--color-text)\">Event Organiser<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <hr style=\"height:2px;border:0;background:var(--color-divider);margin:0 0 20px\">\n      <p style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 60%, transparent);margin:0\">© 2026 Omni Skills Olympiad. All events offline / physical.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============================================================ -->\n<!-- PART 2 — LOGGED-IN PORTAL (student / mentor)                  -->\n<!-- ============================================================ -->\n<sc-if value=\"{{ isPortal }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n  <div style=\"display:flex;align-items:center;gap:16px;padding:12px clamp(16px,3vw,32px);border-bottom:2px solid var(--color-divider);background:var(--color-bg);position:sticky;top:0;z-index:50\">\n    <div style=\"display:flex;align-items:center;gap:8px;cursor:pointer\" sc-camel-on-click=\"{{ goHome }}\">\n      <img src=\"64cbb102-90d4-4bc7-9c62-c0947d75f749\" alt=\"Omni Skills Olympiad\" style=\"height:30px;width:30px;object-fit:contain\">\n      <span style=\"font-family:var(--font-heading);font-weight:800;font-size:13px\">OMNI SKILLS OLYMPIAD<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto;display:flex;gap:10px;align-items:center\">\n      <div class=\"seg\">\n        <label class=\"seg-opt\"><input type=\"radio\" name=\"portalrole\" checked=\"{{ isPortalStudent }}\" sc-camel-on-change=\"{{ setPortalRole_student }}\">Viewing as Student<\u002Flabel>\n        <label class=\"seg-opt\"><input type=\"radio\" name=\"portalrole\" checked=\"{{ isPortalMentor }}\" sc-camel-on-change=\"{{ setPortalRole_mentor }}\">Viewing as Mentor<\u002Flabel>\n        <label class=\"seg-opt\"><input type=\"radio\" name=\"portalrole\" checked=\"{{ isPortalInstitutionAdmin }}\" sc-camel-on-change=\"{{ setPortalRole_institutionAdmin }}\">Viewing as Institution Admin<\u002Flabel>\n      <\u002Fdiv>\n      <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goHome }}\">Exit to public site<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ---------- STUDENT DASHBOARD ---------- -->\n  <sc-if value=\"{{ isPortalStudent }}\" hint-placeholder-val=\"{{ true }}\">\n    <main style=\"padding-left:56px\">\n      <aside style=\"position:fixed;top:58px;left:0;bottom:0;width:{{ drawerWidth }};background:var(--color-bg);border-right:2px solid var(--color-divider);padding:16px 8px;overflow-x:hidden;overflow-y:auto;z-index:60;transition:width .22s ease;box-shadow:{{ drawerShadow }};display:flex;flex-direction:column;gap:2px\" sc-camel-on :var(--color-bg);border-color:var(--color-bg)\">Start today's quiz<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"padding:22px;background:var(--color-surface);transition:transform .3s\" style-hover=\"transform:translateY(-6px)\">\n                <p class=\"card-kicker\">Mentor<\u002Fp>\n                <h3 style=\"font-size:17px;margin:8px 0\">Divya Menon<\u002Fh3>\n                <p style=\"font-size:13px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0 0 16px\">Cybersecurity Lead, Wipro · Request accepted<\u002Fp>\n                <button type=\"button\" class=\"btn btn-secondary\">Open chat<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:12px;flex-wrap:wrap\">\n              <p class=\"card-kicker\" style=\"margin:0\">Course progress<\u002Fp>\n              <span class=\"tag tag-accent\">Level 4 of 7 — Green: Projects<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:6px;margin-bottom:8px;align-items:flex-end\">\n              <sc-for list=\"{{ vibgyorLevels }}\" as=\"v\" hint-placeholder-count=\"7\">\n                <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:6px\">\n                  <sc-if value=\"{{ v.isCurrent }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"font-size:9px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;color:var(--color-accent-700);white-space:nowrap\">You are here<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ v.isNotCurrent }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"font-size:9px;opacity:0\">·<\u002Fspan>\n                  <\u002Fsc-if>\n                  <div style=\"width:100%;height:44px;background:{{ v.color }};opacity:{{ v.barOpacity }};display:flex;align-items:center;justify-content: ">You've been invited to the OSO National Finals — see My Competitions.<\u002Fp><\u002Fdiv>\n              <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goStudentCompetitions }}\">View invitation<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"background:var(--color-surface);padding:20px;margin-bottom:20px;display:flex;gap:14px;align-items:center\">\n              <div style=\"width:44px;height:44px;flex-shrink:0;background:var(--color-text);display:flex;align-items:center;justify-content:center;color:var(--color-bg);font-family:var(--font-heading);font-weight:800\">18<\u002Fdiv>\n              <div>\n                <p class=\"card-kicker\" style=\"margin:0 0 4px\">Upcoming competition<\u002Fp>\n                <p style=\"font-family:var(--font-heading);font-weight:700;font-size:14px;margin:0\">Skill-on Circuit, Bengaluru<\u002Fp>\n                <p style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 65%, transparent);margin:2px 0 0\">18 Oct 2026 · Confirmed<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--color-text);color:var(--color-bg);padding:24px\">\n              <p class=\"card-kicker\" style=\"color:var(--color-accent-400);margin:0 0 4px\">Leaderboard<\u002Fp>\n              <p style=\"font-size:12px;opacity:0.75;margin:0 0 20px\">Your rank against peers, all time<\u002Fp>\n              <div style=\"display:flex;align-items:flex-end;gap:8px;margin-bottom:20px\">\n                <sc-for list=\"{{ studentPodium }}\" as=\"l\" hint-placeholder-count=\"3\">\n                  <div style=\"flex:1;order:{{ l.order }};display:flex;flex-direction:column;align-items:center;gap:6px\">\n                    <p style=\"font-size:11px;font-weight:700;margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px\">{{ l.name }}<\u002Fp>\n                    <div style=\"width:100%;height:{{ l.podiumHeight }};background:{{ l.color }};display:flex;align-items:flex-start;justify-content:center;padding-top:6px\">\n                      <span style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;color:#fff\">#{{ l.rank }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ studentLeaderboardRest }}\" as=\"l\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-top:1px solid color-mix(in srgb, var(--color-bg) 15%, transparent)\">\n                    <span style=\"opacity:0.85\">#{{ l.rank }} {{ l.name }}<\u002Fspan>\n                    <span style=\"font-weight:700\">{{ l.score }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isStudentCompetitions }}\" hint-placeholder-val=\"{{ false }}\">\n        <h2 style=\"font-size:24px;margin:0 0 8px\">My Competitions<\u002Fh2>\n        <p style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 75%, transparent);margin:0 0 28px\">Respond to invitations here. Completed rounds and their scores are listed below.<\u002Fp>\n\n        <!-- INVITATION / REGISTRATION FLOW (top-200 leaderboard invite) -->\n        <sc-if value=\"{{ isInviteStage }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:var(--color-text);color:var(--color-bg);padding:26px 28px;margin-bottom:32px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center\">\n            <div style=\"width:44px;height:44px;background:var(--color-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0\">\ ><sc-raw-th>Score<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ leaderboardWithHighlightFiltered }}\" as=\"l\" hint-placeholder-count=\"8\">\n              <sc-raw-tr style=\"background:{{ l.highlight }}\">\n                <sc-raw-td style=\"font-family:var(--font-heading);font-weight:800;color:var(--color-accent)\">#{{ l.rank }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"font-weight:600\">{{ l.name }}<\u002Fsc-raw-td>\n                <sc-raw-td>{{ l.institute }}<\u002Fsc-raw-td>\n                <sc-raw-td>{{ l.domain }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"font-weight:700\">{{ l.score }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- PROFILE TAB -->\n        <sc-if value=\"{{ isStudentProfile }}\" hint-placeholder-val=\"{{ false }}\">\n        <h2 style=\"font-size:24px;margin:0 0 24px\">Profile<\u002Fh2>\n        <div class=\"oso-2col\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,1fr);gap:32px;margin-bottom:32px\">\n          <form style=\"display:flex;flex-direction:column;gap:16px\">\n            <div class=\"field\"><label>Full name<\u002Flabel><input class=\"input\" type=\"text\" sc-camel-default-value=\"Aditi Sharma\"><\u002Fdiv>\n            <div class=\"field\"><label>Email<\u002Flabel><input class=\"input\" type=\"email\" sc-camel-default-value=\"aditi.sharma@example.com\"><\u002Fdiv>\n            <div class=\"field\"><label>College / Institute<\u002Flabel><input class=\"input\" type=\"text\" sc-camel-default-value=\"RV College of Engineering\"><\u002Fdiv>\n            <div class=\"field\"><label>Track<\u002Flabel><input class=\"input\" type=\"text\" sc-camel-default-value=\"Engineering\"><\u002Fdiv>\n            <div class=\"field\"><label>Domain<\u002Flabel><input class=\"input\" type=\"text\" sc-camel-default-value=\"Cyber Security\"><\u002Fdiv>\n            <button type=\"button\" class=\"btn btn-primary btn-block\">Save changes<\u002Fbutton>\n          <\u002Fform>\n          <div>\n            <div class=\"grayscale\" style=\"width:120px;height:120px;margin-bottom:16px\"><image-slot id=\"student-profile-photo\" shape=\"rect\" placeholder=\"Profile photo\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"padding:20px;background:var(--color-surface);margin-bottom:16px\">\n              <p class=\"card-kicker\" style=\"margin:0 0 8px\">Account summary<\u002Fp>\n              <p style=\"font-size:13px;margin:0 0 4px\">Overall score: <strong>2668<\u002Fstrong><\u002Fp>\n              <p style=\"font-size:13px;margin:0 0 4px\">National rank: <strong>#3<\u002Fstrong><\u002Fp>\n              <p style=\"font-size:13px;margin:0\">Quiz streak: <strong>18 days<\u002Fstrong><\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:18px;background:var(--color-surface)\">\n              <p class=\"card-kicker\" style=\"margin:0 0 10px\">Share your profile<\u002Fp>\n              <div style=\"display:flex;gap:8px\">\n                <input class=\"input\" style=\"flex:1;font-size:12px\" type=\"text\" sc-camel-read-only=\"{{ true }}\" value=\"oso.app/u/aditi-sharma\">\n                <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ copyStudentProfileLink }}\">{{ studentCopyLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <p class=\"card-kicker\" style=\"margin-bottom:16px\">My institution<\u002Fp>\n        <sc-if value=\"{{ hasStudentInstitution }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:var(--color-surface);padding:24px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\">\n            <div><p style=\"font-family:var(--font-heading);font-weight:700;font-size: <path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"><\u002Fpath><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg><span style=\"display:{{ sideLabelDisplay }};white-space:nowrap\">My Mentees<\u002Fspan><\u002Fa>\n        <a href=\"javascript:void(0)\" class=\"oso-sidelink\" style=\"justify-content:{{ sideLinkJustify }}\" aria-current=\"{{ mentorCurrent.jury }}\" sc-camel-on-click=\"{{ goMentorJury }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0\"><path d=\"M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z\"><\u002Fpath><\u002Fsvg><span style=\"display:{{ sideLabelDisplay }};white-space:nowrap\">Jury Invitations<\u002Fspan><\u002Fa>\n        <a href=\"javascript:void(0)\" class=\"oso-sidelink\" style=\"justify-content:{{ sideLinkJustify }}\" aria-current=\"{{ mentorCurrent.referrals }}\" sc-camel-on-click=\"{{ goMentorReferrals }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0\"><circle cx=\"18\" cy=\"5\" r=\"3\"><\u002Fcircle><circle cx=\"6\" cy=\"12\" r=\"3\"><\u002Fcircle><circle cx=\"18\" cy=\"19\" r=\"3\"><\u002Fcircle><line x1=\"8.59\" y1=\"13.51\" x2=\"15.42\" y2=\"17.49\"><\u002Fline><line x1=\"15.41\" y1=\"6.51\" x2=\"8.59\" y2=\"10.49\"><\u002Fline><\u002Fsvg><span style=\"display:{{ sideLabelDisplay }};white-space:nowrap\">Referrals<\u002Fspan><\u002Fa>\n        <a href=\"javascript:void(0)\" class=\"oso-sidelink\" style=\"justify-content:{{ sideLinkJustify }}\" aria-current=\"{{ mentorCurrent.blog }}\" sc-camel-on-click=\"{{ goMentorBlog }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\u002Fpath><polyline points=\"14 2 14 8 20 8\"><\u002Fpolyline><line x1=\"16\" y1=\"13\" x2=\"8\" y2=\"13\"><\u002Fline><line x1=\"16\" y1=\"17\" x2=\"8\" y2=\"17\"><\u002Fline><\u002Fsvg><span style=\"display:{{ sideLabelDisplay }};white-space:nowrap\">Publish a Blog<\u002Fspan><\u002Fa>\n        <a href=\"javascript:void(0)\" class=\"oso-sidelink\" style=\"justify-content:{{ sideLinkJustify }}\" aria-current=\"{{ mentorCurrent.profile }}\" sc-camel-on-click=\"{{ goMentorProfile }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"12\" cy=\"7\" r=\"4\"><\u002Fcircle><\u002Fsvg><span style=\"display:{{ sideLabelDisplay }};white-space:nowrap\">Profile<\u002Fspan><\u002Fa>\n        <hr style=\"height:2px;border:0;background:var(--color-divider);margin:12px 0\">\n        <a href=\"javascript:void(0)\" class=\"oso-sidelink\" style=\"justify-content:{{ sideLinkJustify }}\" sc-camel-on-click=\"{{ goHome }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"><\u002Fpath><polyline points=\"16 17 21 12 16 7\"><\u002Fpolyline><line x1=\"21\" y1=\"12\" x2=\"9\" y2=\"12\"><\u002Fline><\u002Fsvg><span style=\"display:{{ sideLabelDisplay }};white-space:nowrap\">Log out<\u002Fspan><\u002Fa>\n      <\u002Faside>\n      <div class=\"oso-page\" style=\"max-width:1400px;margin:0 auto;padding:clamp(20px,3vw,32px) clamp(16px,3vw,32px)\">\n        <div style=\"background:linear-gradient(100deg, {{ vibgyor[1].color ound: 'Regional Round — West', city: 'Pune', date: '8 Nov 2026', status: 'Closing soon' },\n    { competition: 'SecureStack', round: 'Regional Round — South', city: 'Hyderabad', date: '22 Nov 2026', status: 'Upcoming' },\n    { competition: 'BuildBot', round: 'Regional Round — South', city: 'Coimbatore', date: '6 Dec 2026', status: 'Upcoming' },\n    { competition: 'CloudSprint', round: 'Regional Round — South', city: 'Bengaluru', date: '13 Dec 2026', status: 'Upcoming' },\n    { competition: 'Skill-on Circuit', round: 'National Final', city: 'Bengaluru', date: '20 Jan 2027', status: 'Upcoming' }\n  ];\n\n  talks = [\n    { title: 'Why Offline Competitions Still Matter', speaker: 'Jayachandra Aradhya', role: 'Founder & Director, OSO', duration: '14 min' },\n    { title: 'Debugging Under Pressure', speaker: 'Karthik Iyer', role: 'Mentor · Data Scientist, Freshworks', duration: '11 min' },\n    { title: 'From ITI Workshop to Industry Floor', speaker: 'Student Highlight Talk', role: 'Winner, BuildBot 2025', duration: '9 min' }\n  ];\n\n  blogs = [\n    { id: 'vibgyor-ladder', title: 'Inside the VIBGYOR Course Ladder', category: 'Courses', author: 'OSO Editorial', date: '2 Sep 2026', excerpt: 'Why the seven-level system is interdependent, and what it takes to unlock Red — Mastery.', imageCount: 3,\n      body: ['The VIBGYOR ladder is OSO\\'s seven-level course structure, named for the colours of the spectrum: Violet, Indigo, Blue, Green, Yellow, Orange, Red. Each level maps to a stage of competition readiness, from fundamentals to national-finals mastery.', 'A student cannot skip a level. Violet covers core problem-solving; Indigo and Blue build domain fundamentals; Green introduces applied projects; Yellow and Orange focus on competition-format practice; Red is reserved for students actively competing at the national level.', 'Mentors track progress level by level, and course invitations are issued only once a mentor judges a student ready to move up.'] },\n    { id: 'quiz-streak', title: 'How the Daily Quiz Streak Actually Works', category: 'Platform', author: 'OSO Editorial', date: '28 Aug 2026', excerpt: 'One quiz a day, scored and streaked — and how it rolls up into your leaderboard rank.', imageCount: 2,\n      body: ['Every student gets one quiz a day, tied to their chosen domain. Missing a day resets the streak counter but not the cumulative score — past points are never taken away.', 'Each quiz contributes a small number of points toward the student\\'s total score, which is the same score used on the leaderboard alongside competition and course points.', 'Streaks are a habit signal, not a ranking factor by themselves — but consistent daily quizzing compounds into a meaningfully higher total score over a season.'] },\n    { id: 'mentor-spotlight-firmware', title: 'Mentor Spotlight: Building Firmware at Scale', category: 'Mentorship', author: 'Arjun Nair', date: '21 Aug 2026', excerpt: 'A firmware engineer at L&T Technology Services on what he looks for in a mentee.', imageCount: 2,\n      body: ['\"I don\\'t look for students who already know embedded C,\" Arjun says. \"I look for ones who get stuck, try three things, and can tell me exactly what each attempt taught them.\"', 'Arjun mentors students in the Embedded Systems domain, most of them working toward the Skill-on Circuit championship track. He reviews their weekly quiz performance and course progress before every mentoring call.', 'His advice to new mentees: keep a build log. Every bug you fix is worth writing down.'] },\n    { id: 'prepping-circuit-2026', title: 'Prepping for Skill-on Circuit 2026', category: 'Competitions', author: 'OSO Editorial', date: '12 Aug 2026', excerpt: 'What to expect at the National Embedded Systems Challenge, round by round.', imageCount: 3,\n      body: ['Skill-on Circuit is OSO\\'s national embedded-systems championship, run in three rounds: a regional qualifier, a state-level round, and the national finals.', 'The regional round tests fundamentals — circuit design and basic firmware. The state round adds a live debugging component under time pressure. The national finals is a full build: teams are given a problem brief and have six hours to design, build, and demo a working device.', 'Students who place in the top of their regional round are invited to the state round automatically; there is no separate application.'] },\n    { id: 'why-entrance-fee', title: 'Why We Charge an Entrance Fee', category: 'Platform', author: 'OSO Editorial', date: '3 Aug 2026', excerpt: 'A nominal per-competition fee covers venue and judging costs, and keeps events physical.', imageCount: 1,\n      body: ['OSO competitions happen in person, at real venues, with real jury panels. That costs money — venue hire, judging honorariums, materials for build-based rounds.', 'The entrance fee is set per competition and is only charged once a student accepts their invitation to compete, after the leaderboard-based invite step. It is never charged for using the platform itself — courses, daily quizzes, and mentorship are free.', 'We keep the fee nominal by design: it should never be the reason a serious student doesn\\'t compete.'] },\n    { id: 'regional-to-national', title: 'From Regional Round to National Finals', category: 'Competitions', author: 'OSO Editorial', date: '22 Jul 2026', excerpt: 'How the top 200 on the leaderboard get invited to the All-Domains Qualifier.', imageCount: 2,\n      body: ['Twice a year, OSO pulls the top 200 students across the national leaderboard and sends them an invitation to the All-Domains Qualifier.', 'Invited students accept from their portal calendar, pay the competition\\'s entrance fee, and receive their event ticket with venue and timing details. There is no separate registration form — the invitation is the registration.', 'From there, qualifier placement determines seeding into that season\\'s National Finals across every domain.'] }\n  ];\n\n  leaderboard = [\n    { rank: 1, name: 'Priya Nataraj', institute: 'PES University', track: 'Engineering', domain: 'AI & ML', score: 2840 },\n    { rank: 2, name: 'Mohammed Faizal', institute: 'Govt Polytechnic, Coimbatore', track: 'Polytechnic', domain: 'Embedded Systems', score: 2715 },\n    { rank: 3, name: 'Aditi Sharma', institute: 'RV College of Engineering', track: 'Engineering', domain: 'Cyber Security', score: 2668 },\n    { rank: 4, name: 'Karan Bhatt', institute: 'VJTI Mumbai', track: 'Engineering', domain: 'Robotics', score: 2554 },\n    { rank: 5, name: 'Lakshmi Iyer', institute: 'ITI Chennai', track: 'ITI', domain: 'Electronics', score: 2410 },\n    { rank: 6, name: 'Rohan Deshmukh', institute: 'COEP Pune', track: 'Engineering', domain: 'Cloud Computing', score: 2388 },\n    { rank: 7, name: 'Sneha Reddy', institute: 'JNTU Hyderabad', track: 'University', domain: 'Data Science', score: 2301 },\n    { rank: 8, name: 'Arun Kumar', institute: 'Govt Polytechnic, Bengaluru', track: 'Polytechnic', domain: 'Programming', score: 2260 },\n    { rank: 9, name: 'Meera Pillai', institute: 'NIT Trichy', track: 'University', domain: 'Civil', score: 2190 }\n  ];\n\n  vibgyor = [\n    { level: 1, name: 'Violet — Foundations', color: '#6d28d9' },\n    { level: 2, name: 'Indigo — Core Concepts', color: '#4338ca' },\n    { level: 3, name: 'Blue — Applied Skills', color: '#2563eb' },\n    { level: 4, name: 'Green — Projects', color: '#16a34a' },\n    { level: 5, name: 'Yellow — Specialization', color: '#ca8a04' },\n    { level: 6, name: 'Orange — Industry Practice', color: '#ea580c' },\n    { level: 7, name: 'Red — Mastery', color: '#dc2626' }\n  ];\n\n  trackCards = [\n    { name: 'Engineering', sub: 'B.E. / B.Tech, all branches', offset: '0px', color: '#4338ca' },\n    { name: 'Polytechnic', sub: 'Diploma programmes, all branches', offset: '-10px', color: '#16a34a' },\n    { name: 'ITI', sub: 'Industrial Training Institute trades', offset: '0px', color: '#ca8a04' },\n    { name: 'University', sub: 'Undergraduate & postgraduate programmes', offset: '-10px', color: '#dc2626' }\n  ];\n\n  domainTags = ['Programming', 'Web Development', 'AI & Machine Learning', 'Data Science', 'Cyber Security', 'Robotics', 'Cloud Computing', 'Electronics & Communication', 'Embedded Systems', 'Mechanical Design', 'Civil Engineering', 'Entrepreneurship'];\n\n  setPage(p) { return () => this.setState({ page: p }); }\n  setPortalRole(r) { return () => this.setState({ page: 'portal', portalRole: r }); }\n  setStudentSection(s) { return () => this.setState({ studentSection: s }); }\n  togglePathChosen = () => this.setState(s => ({ studentHasPath: !s.studentHasPath }));\n  choosePath = () => this.setState({ studentHasPath: true });\n  acceptInvite = () => this.setState({ regStage: 'level' });\n  declineInvite = () => this.setState({ regStage: 'declined' });\n  selectLevel(lvl) { return () => this.setState({ selectedLevel: lvl }); }\n  goPaymentStage = () => this.setState({ regStage: 'payment' });\n  payAndGenerateTicket = () => this.setState({ regStage: 'ticket', ticketId: 'OSO-NF27-' + Math.floor(10000 + Math.random() * 89999) });\n  closeTicket = () => this.setState({ regStage: 'done' });\n\n  setCalendarView(v) { return () => this.setState({ calendarView: v }); }\n  calGoToday = () => this.setState({ calendarViewDate: new Date() });\n  calPrev = () => this.setState(s => {\n    const d = new Date(s.calendarViewDate);\n    if (s.calendarView === 'month') d.setMonth(d.getMonth() - 1);\n    else if (s.calendarView === 'week') d.setDate(d.getDate() - 7);\n    else d.setDate(d.getDate() - 1);\n    return { calendarViewDate: d };\n  });\n  calNext = () => this.setState(s => {\n    const d = new Date(s.calendarViewDate);\n    if (s.calendarView === 'month') d.setMonth(d.getMonth() + 1);\n    else if (s.calendarView === 'week') d.setDate(d.getDate() + 7);\n    else d.setDate(d.getDate() + 1);\n    return { calendarViewDate: d };\n  });\n  selectEvent(id) { return () => this.setState({ selectedEventId: id }); }\n  openMoreDay(iso) { return () => this.setState({ moreDayIso: iso }); }\n  closeMoreDay = () => this.setState({ moreDayIso: null });\n  openDrawer = () => this.setState({ drawerOpen: true });\n  closeDrawer = () => this.setState({ drawerOpen: false });\n  _filteredMentors() {\n    const q = this.state.mentorSearchSkill.trim().toLowerCase();\n    if (!q) return this.mentors;\n    return this.mentors.filter(m => m.skills.some(s => s.toLowerCase().includes(q)) || m.domain.toLowerCase().includes(q));\n  }\n  engineeringBranches = ['Computer Science Engineering', 'Information Science', 'Electronics & Communication', 'Electrical & Electronics', 'Mechanical Engineering', 'Civil Engineering', 'Artificial Intelligence & Machine Learning', 'Data Science', 'Artificial Intelligence', 'Other'];\n  diplomaBranches = ['Diploma in Computer Science', 'Diploma in Mechanical Engineering', 'Diploma in Civil Engineering', 'Diploma in Electronics', 'Diploma in Electrical', 'Other'];\n  interestsList = ['Programming', 'Web Development', 'Artificial Intelligence', 'Machine Learning', 'Data Science', 'Cyber Security', 'Robotics', 'Cloud Computing', 'Electronics', 'Embedded Systems', 'Mechanical Design', 'Civil Engineering', 'Entrepreneurship', 'Career Guidance', 'Higher Studies', 'Other'];\n\n  goRegisterStudent = () => { this.setState({ page: 'register', registerTab: 'student', regFlowStage: 'email', registerEmail: '', registerOtp: '', registerEmailError: false, registerOtpError: false, selectedInterests: [], courseType: 'Engineering' }); window.scrollTo(0, 0); };\n  setRegisterEmail = (e) => this.setState({ registerEmail: e.target.value, registerEmailError: false });\n  setRegisterOtp = (e) => this.setState({ registerOtp: e.target.value, registerOtpError: false });\n  sendOtp = () => {\n    const valid = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(this.state.registerEmail);\n    if (!valid) { this.setState({ registerEmailError: true }); return; }\n    this.setState({ regFlowStage: 'otp', registerEmailError: false, registerOtp: '' });\n  };\n  backToEmailStep = () => this.setState({ regFlowStage: 'email' });\n  verifyOtp = () => {\n    if (this.state.registerOtp.trim() !== '123456') { this.setState({ registerOtpError: true }); return; }\n    this.setState({ regFlowStage: 'form', registerOtpError: false });\n  };\n  setCourseType(type) { return () => this.setState({ courseType: type }); }\n  toggleInterest(name) { return () => this.setState(s => ({ selectedInterests: s.selectedInterests.includes(name) ? s.selectedInterests.filter(i => i !== name) : [...s.selectedInterests, name] })); }\n  completeRegistration = () => this.setState({ regFlowStage: 'done' });\n\n  professionalCategories = ['Engineering Faculty', 'Diploma Faculty', 'Professor', 'Industry Professional', 'IT Professional', 'Subject Matter Expert', 'Other'];\n  goRegisterMentor = () => { this.setState({ page: 'register', registerTab: 'mentor', mentorRegStage: 'email', mentorRegEmail: '', mentorRegOtp: '', mentorRegEmailError: false, mentorRegOtpError: false }); window.scrollTo(0, 0); };\n  setMentorRegEmail = (e) => this.setState({ mentorRegEmail: e.target.value, mentorRegEmailError: false });\n  setMentorRegOtp = (e) => this.setState({ mentorRegOtp: e.target.value, mentorRegOtpError: false });\n  sendMentorOtp = () => {\n    const valid = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(this.state.mentorRegEmail);\n    if (!valid) { this.setState({ mentorRegEmailError: true }); return; }\n    this.setState({ mentorRegStage: 'otp', mentorRegEmailError: false, mentorRegOtp: '' });\n  };\n  backToMentorEmailStep = () => this.setState({ mentorRegStage: 'email' });\n  verifyMentorOtp = () => {\n    if (this.state.mentorRegOtp.trim() !== '123456') { this.setState({ mentorRegOtpError: true }); return; }\n    this.setState({ mentorRegStage: 'form', mentorRegOtpError: false });\n  };\n  submitMentorRegistration = () => this.setState({ mentorRegStage: 'pending' });\n  toggleMentorChosen = () => this.setState(s => ({ mentorCount: (((s.mentorCount ?? 1) + 1) % 3) }));\n  setMentorSearchSkill = (e) => this.setState({ mentorSearchSkill: e.target.value });\n  viewStudent(id, returnTab) { return () => this.setState({ mentorView: 'studentProfile', selectedStudentId: id, mentorReturnTo: returnTab || 'dashboard' }); }\n  backFromStudentProfile = () => this.setState({ mentorView: this.state.mentorReturnTo || 'dashboard' });\n  goMentorOverview = () => this.setState({ mentorView: 'dashboard' });\n  goMentorRequests = () => this.setState({ mentorView: 'requests' });\n  goMentorMentees = () => this.setState({ mentorView: 'mentees' });\n  goMentorBlog = () => this.setState({ mentorView: 'blog' });\n  goMentorProfile = () => this.setState({ mentorView: 'profile' });\n  goMentorJury = () => this.setState({ mentorView: 'jury' });\n  goMentorReferrals = () => this.setState({ mentorView: 'referrals' });\n  selectEventAndClose(id) { return () => this.setState({ selectedEventId: id, moreDayIso: null }); }\n\n  setCalFilterCityFromEvent = (e) => this.setState({ calFilterCity: e.target.value });\n  setLeaderboardBranch(b) { return () => this.setState({ leaderboardBranchFilter: b }); }\n  setBlogCategory(c) { return () => this.setState({ blogCategoryFilter: c }); }\n  openBlog(id) { return () => { this.setState({ page: 'blogPost', activeBlogId: id }); window.scrollTo(0, 0); }; }\n  setContactType = (e) => this.setState({ contactType: e.target.value });\n  setPortalLeaderboardBranch(b) { return () => this.setState({ portalLeaderboardBranchFilter: b }); }\n  acceptInviteFromCalendar = () => { this.acceptInvite(); this.setState({ studentSection: 'competitions' }); };\n  declineInviteFromCalendar = () => { this.declineInvite(); this.setState({ studentSection: 'competitions' }); };\n  linkRegInstitution(name) { return () => this.setState({ regFlowStage: 'done', regInstitution: name }); }\n  skipRegInstitution = () => this.setState({ regFlowStage: 'done', regInstitution: null });\n  goRegisterInstitution = () => { this.setState({ page: 'register', registerTab: 'institution', instRegStage: 'form' }); window.scrollTo(0, 0); };\n  submitInstitutionRegistration = () => this.setState({ instRegStage: 'pending' });\n  goInstAdminOverview = () => this.setState({ institutionAdminSection: 'overview' });\n  goInstAdminStudents = () => this.setState({ institutionAdminSection: 'students' });\n  goInstAdminProfile = () => this.setState({ institutionAdminSection: 'profile' });\n  tagStudent(id) { return () => this.setState(s => {\n    const u = s.unlinkedStudentPool.find(x => x.id === id);\n    if (!u) return {};\n    return {\n      unlinkedStudentPool: s.unlinkedStudentPool.filter(x => x.id !== id),\n      institutionMembers: [...s.institutionMembers, { id: 'im' + Date.now(), name: u.name, domain: 'Unassigned', joinedDate: 'Today', role: 'Member' }]\n    };\n  }); }\n  removeMember(id) { return () => this.setState(s => ({ institutionMembers: s.institutionMembers.filter(m => m.id !== id) })); }\n  viewInstMember(id) { return () => this.setState({ institutionAdminSection: 'studentProfile', instAdminSelectedMemberId: id }); }\n  backFromInstMemberProfile = () => this.setState({ institutionAdminSection: 'students' });\n  setMemberRole(id) { return (e) => {\n    const role = e.target.value;\n    this.setState(s => ({ institutionMembers: s.institutionMembers.map(m => {\n      if (m.id === id) return { ...m, role };\n      if (role === 'President' && m.role === 'President') return { ...m, role: 'Member' };\n      return m;\n    }) }));\n  }; }\n  _juryDaysLeft(invitedOn) { if (!invitedOn) return null; const invited = new Date(invitedOn + 'T00:00:00'); const expires = new Date(invited); expires.setDate(expires.getDate() + 7); const diff = Math.ceil((expires - new Date()) / 86400000); return diff; }\n  acceptJury(id) { return () => this.setState(s => ({ juryInvitations: s.juryInvitations.map(j => j.id === id ? { ...j, status: 'Accepted' } : j) })); }\n  declineJury(id) { return () => this.setState(s => ({ juryInvitations: s.juryInvitations.map(j => j.id === id ? { ...j, status: 'Declined' } : j) })); }\n  setReferMentorName = (e) => this.setState({ referMentorName: e.target.value });\n  setReferMentorEmail = (e) => this.setState({ referMentorEmail: e.target.value });\n  addMentorReferral = () => { if (!this.state.referMentorName.trim()) return; this.setState(s => ({ mentorReferrals: [...s.mentorReferrals, { name: s.referMentorName, email: s.referMentorEmail, status: 'Invited' }], referMentorName: '', referMentorEmail: '' })); };\n  setReferStudentEmail = (e) => this.setState({ referStudentEmail: e.target.value });\n  setReferStudentUsn = (e) => this.setState({ referStudentUsn: e.target.value });\n  openStudentReferralDialog = () => this.setState({ studentReferralDialogOpen: true, referStudentEmail: '', referStudentUsn: '' });\n  closeStudentReferralDialog = () => this.setState({ studentReferralDialogOpen: false });\n  addStudentReferral = () => { if (!this.state.referStudentEmail.trim() || !this.state.referStudentUsn.trim()) return; this.setState(s => ({ studentReferrals: [...s.studentReferrals, { email: s.referStudentEmail, usn: s.referStudentUsn, status: 'Pending' }], referStudentEmail: '', referStudentUsn: '', studentReferralDialogOpen: false })); };\n  linkStudentInstitutionDemo = () => this.setState({ studentInstitution: 'RV College of Engineering' });\n  copyStudentProfileLink = () => { try { navigator.clipboard.writeText('https://oso.app/u/aditi-sharma'); } catch (e) {} this.setState({ studentCopyLabel: 'Copied!' }); setTimeout(() => this.setState({ studentCopyLabel: 'Copy link' }), 1500); };\n  copyMentorProfileLink = () => { try { navigator.clipboard.writeText('https://oso.app/mentor/karthik-iyer'); } catch (e) {} this.setState({ mentorCopyLabel: 'Copied!' }); setTimeout(() => this.setState({ mentorCopyLabel: 'Copy link' }), 1500); };\n  acceptCourseInvite = () => this.setState({ courseInviteStatus: 'accepted' });\n  declineCourseInvite = () => this.setState({ courseInviteStatus: 'declined' });\n\n  isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }\n  sameDay(a, b) { return this.isoOf(a) === this.isoOf(b); }\n\n  quizHistory = [\n    { date: '4 Sep 2026', topic: 'Symmetric Encryption', score: 9, streak: 17 },\n    { date: '3 Sep 2026', topic: 'Network Protocols', score: 8, streak: 16 },\n    { date: '2 Sep 2026', topic: 'OWASP Top 10', score: 10, streak: 15 },\n    { date: '1 Sep 2026', topic: 'Access Control Models', score: 7, streak: 14 },\n    { date: '31 Aug 2026', topic: 'Hashing & Salting', score: 9, streak: 13 },\n    { date: '30 Aug 2026', topic: 'Firewalls & IDS', score: 8, streak: 12 }\n  ];\n\n  vibgyorLevelsBase = [\n    { level: 1, name: 'Violet — Foundations', color: '#6d28d9', modules: 6, status: 'done' },\n    { level: 2, name: 'Indigo — Core Concepts', color: '#4338ca', modules: 8, status: 'done' },\n    { level: 3, name: 'Blue — Applied Skills', color: '#2563eb', modules: 7, status: 'done' },\n    { level: 4, name: 'Green — Projects', color: '#16a34a', modules: 5, status: 'current' },\n    { level: 5, name: 'Yellow — Specialization', color: '#ca8a04', modules: 6, status: 'locked' },\n    { level: 6, name: 'Orange — Industry Practice', color: '#ea580c', modules: 4, status: 'locked' },\n    { level: 7, name: 'Red — Mastery', color: '#dc2626', modules: 3, status: 'locked' }\n  ];\n\n  renderVals() {\n    const p = this.state.page;\n    const vg = this.vibgyor;\n    const cycle = (i) => vg[i % vg.length].color;\n    const top3raw = this.leaderboard.slice(0, 3);\n    const competitionsColored = this.competitions.map((c, i) => ({ ...c, color: cycle(i) }));\n    const domainTagsColored = this.domainTags.map((d, i) => ({ name: d, color: cycle(i) }));\n    const leaderboardTop3 = [\n      { ...top3raw[1], podiumHeight: '150px', order: 1, color: cycle(1) },\n      { ...top3raw[0], podiumHeight: '190px
